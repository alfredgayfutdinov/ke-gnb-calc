<style>
  @page {
    size: A3 landscape;
    margin: 0;
  }
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #1e1e24;
    color: #e0e0e0;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* БАЗОВЫЕ СТИЛИ БОКОВЫХ ПАНЕЛЕЙ */
  .sidebar {
    width: 380px;
    min-width: 380px;
    background: #25252d;
    display: flex;
    flex-direction: column;
    height: 100%;
    z-index: 10;
  }
  .left-sidebar { border-right: 1px solid #383844; }
  .right-sidebar { border-left: 1px solid #383844; }

  .sidebar-header {
    padding: 16px 20px;
    background: #1a1a20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #383844;
  }
  .sidebar-header h2 {
    margin: 0;
    font-size: 16px;
    color: #fff;
  }
  
  /* ПАНЕЛЬ ВКЛАДОК ПРОФИЛЕЙ */
  .tabs-container {
    display: flex;
    background: #1a1a20;
    border-bottom: 1px solid #383844;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs-container::-webkit-scrollbar { display: none; }
  .tab-btn {
    padding: 10px 16px;
    background: #1a1a20;
    color: #888;
    border: none;
    border-right: 1px solid #383844;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    transition: background 0.2s;
  }
  .tab-btn.active {
    color: #4da3ff;
    background: #25252d;
    border-bottom: 2px solid #4da3ff;
  }
  .tab-btn:hover:not(.active) {
    color: #eee;
    background: #2a2a35;
  }
  .tab-del {
    color: #ff5252;
    background: transparent;
    border: none;
    font-size: 14px;
    line-height: 1;
    padding: 0 4px;
    margin-right: -4px;
    cursor: pointer;
    display: none;
  }
  .tab-btn:hover .tab-del { display: inline-block; }
  .tab-add {
    background: transparent;
    color: #4da3ff;
    border: none;
    font-size: 18px;
    padding: 0 16px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.2s;
  }
  .tab-add:hover { background: #2a2a35; }

  .sidebar-body {
    padding: 16px 20px;
    overflow-y: auto;
    flex: 1;
  }

  .section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #4da3ff;
    margin: 16px 0 10px;
    font-weight: 700;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .form-group { margin-bottom: 12px; }
  .form-group label {
    display: block;
    font-size: 11px;
    color: #aaa;
    margin-bottom: 4px;
    white-space: nowrap;
  }
  .form-row { display: flex; gap: 8px; }
  .form-row .form-group { flex: 1; margin-bottom: 0; }
  input, select {
    width: 100%;
    background: #18181f;
    border: 1px solid #3c3c4a;
    border-radius: 4px;
    padding: 7px 10px;
    color: #fff;
    font-size: 13px;
    outline: none;
  }
  input:focus, select:focus { border-color: #007acc; }
  input:disabled { background: #22222a; color: #666; border-color: #33333d; cursor: not-allowed; }

  .net-item {
    background: #1e1e26;
    border: 1px solid #353545;
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 8px;
  }
  .net-item-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .net-badge {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
    font-weight: bold;
    text-transform: uppercase;
  }
  .badge-gas { background: #00008b; color: #fff; }
  .badge-power { background: #ff0000; color: #fff; }
  .badge-water { background: #006400; color: #fff; }
  .badge-sewer { background: #8b4513; color: #fff; }
  .badge-heat { background: #000000; color: #fff; }
  .badge-comm { background: #ba68c8; color: #fff; }

  .btn-remove-net {
    background: none;
    border: none;
    color: #ff5252;
    cursor: pointer;
    font-size: 15px;
  }
  .btn-add-net {
    width: 100%;
    background: #2a2a38;
    color: #4da3ff;
    border: 1px dashed #4da3ff;
    padding: 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
    margin-top: 4px;
    transition: background 0.2s;
  }
  .btn-add-net:hover { background: #323245; }

  .sidebar-footer {
    padding: 14px 20px;
    background: #1a1a20;
    border-top: 1px solid #383844;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .btn-primary {
    background: #007acc;
    color: #fff;
    border: none;
    padding: 10px;
    border-radius: 5px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: background 0.2s;
  }
  .btn-primary:hover { background: #0066aa; }
  
  .btn-success {
    background: #28a745;
    color: #fff;
    border: none;
    padding: 10px;
    border-radius: 5px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: background 0.2s;
  }
  .btn-success:hover { background: #218838; }
  .btn-success:disabled { background: #6c757d; cursor: not-allowed; }
  
  .btn-danger {
    background: transparent;
    color: #ff5252;
    border: 1px solid #ff5252;
    padding: 10px;
    border-radius: 5px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: all 0.2s;
  }
  .btn-danger:hover { background: rgba(255, 82, 82, 0.1); }
  
  .export-group { display: flex; gap: 8px; }
  .btn-secondary {
    flex: 1;
    background: #333340;
    color: #ddd;
    border: 1px solid #484858;
    padding: 7px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
  }
  .btn-secondary:hover { background: #3d3d4e; color: #fff; }

  /* ЦЕНТРАЛЬНАЯ ОБЛАСТЬ: ПРОСМОТР С ЗУМОМ */
  .viewport {
    flex: 1;
    height: 100%;
    overflow: auto;
    background: #404249;
    padding: 24px;
    position: relative;
    user-select: none;
  }
  
  /* ПАНЕЛЬ МАСШТАБИРОВАНИЯ */
  .zoom-toolbar {
    position: absolute;
    top: 16px;
    right: 24px;
    background: rgba(30, 30, 36, 0.9);
    backdrop-filter: blur(4px);
    border: 1px solid #444455;
    border-radius: 6px;
    padding: 4px 8px;
    display: flex;
    align-items: center;
    gap: 6px;
    z-index: 100;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }
  .btn-zoom {
    background: #2a2a35;
    border: 1px solid #444455;
    color: #eee;
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 12px;
    cursor: pointer;
    font-weight: bold;
  }
  .btn-zoom:hover { background: #007acc; color: #fff; border-color: #007acc; }
  .zoom-val {
    font-size: 11px;
    color: #aaa;
    min-width: 44px;
    text-align: center;
  }

  .sheet-wrapper {
    display: inline-block;
    transform-origin: top left;
    transition: transform 0.12s ease-out;
  }
  
  /* ЧЕРТЕЖ: Принудительный ГОСТовский шрифт и курсив */
  .sheet {
    width: 1587px;
    height: 1122px;
    min-width: 1587px;
    min-height: 1122px;
    background: #ffffff;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    position: relative;
    padding: 38px 19px 19px 76px;
    box-sizing: border-box;
    font-family: "ISOCPEUR", "GOST 2.304 type A", Arial, sans-serif !important;
    font-style: italic !important;
    color: #000;
  }
  svg text {
    font-family: "ISOCPEUR", "GOST 2.304 type A", Arial, sans-serif !important;
    font-style: italic !important;
  }

  .frame {
    width: 100%;
    height: 100%;
    border: 2px solid #000;
    position: relative;
    padding: 12px 15px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }
  .title-block {
    text-align: center;
    font-weight: bold;
    font-size: 18px; 
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    color: #000;
  }
  .subtitle {
    font-size: 14px;
    font-weight: normal;
    color: #333;
    margin-top: 3px;
  }
  .svg-container {
    flex: 1;
    width: 100%;
    height: calc(100% - 45px);
  }
  svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* КАСТОМНОЕ МОДАЛЬНОЕ ОКНО */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.6);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(2px);
  }
  .modal-box {
    background: #25252d;
    padding: 24px;
    border-radius: 8px;
    border: 1px solid #383844;
    width: 320px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .modal-box h3 {
    margin-top: 0;
    color: #fff;
    font-size: 15px;
    margin-bottom: 16px;
    border-bottom: 1px solid #383844;
    padding-bottom: 10px;
  }
  .modal-buttons {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  #multiPrintArea { display: none; }
  
  @media print {
    body { background: #fff !important; }
    .sidebar, .zoom-toolbar, .modal-overlay { display: none !important; visibility: hidden !important; }
    .viewport { padding: 0 !important; margin: 0 !important; background: #fff !important; overflow: visible !important; }
    .sheet-wrapper { transform: none !important; }
    
    body.print-all-mode .viewport { display: none !important; }
    body.print-all-mode #multiPrintArea { display: block !important; }
    .print-page { page-break-after: always; break-after: page; }
    .print-page:last-child { page-break-after: auto; break-after: auto; }
  }
</style>
</head>
<body>

<div class="modal-overlay" id="singleNetModal">
  <div class="modal-box">
    <h3>Добавить пересекаемую коммуникацию</h3>
    <div class="form-group">
      <label>Тип коммуникации</label>
      <select id="modalNetType">
        <option value="power">Электрокабель</option>
        <option value="gas">Газопровод</option>
        <option value="water">Водопровод</option>
        <option value="sewer">Канализация</option>
        <option value="heat">Теплосеть</option>
        <option value="comm">Кабель связи</option>
      </select>
    </div>
    <div class="form-group">
      <label>Расстояние до сети (ПК, метры)</label>
      <input type="text" id="modalNetDist" placeholder="например, 15.5">
    </div>
    <div class="modal-buttons">
      <button class="btn-primary" style="flex:1; font-size:12px; padding:8px;" onclick="confirmSingleNet()">Добавить</button>
      <button class="btn-secondary" style="flex:1; font-size:12px; padding:8px;" onclick="closeSingleNetModal()">Отмена (Закрыть)</button>
    </div>
  </div>
</div>

<!-- ЛЕВАЯ ПАНЕЛЬ (ПАРАМЕТРЫ ТРАССЫ И РЕЛЬЕФ) -->
<div class="sidebar left-sidebar">
  <div class="sidebar-header" style="border-bottom: none;">
    <h2>⚡ Профили ГНБ / ГНП</h2>
  </div>
  
  <div class="tabs-container" id="tabsContainer"></div>

  <div class="sidebar-body">
    <div class="section-title">Геометрия скважины</div>
    <div class="form-row">
      <div class="form-group">
        <label>Номер / Тип</label>
        <div style="display:flex; gap:8px; align-items:center;">
          <input type="text" id="inpNumber" value="1" onchange="triggerUpdate()" style="flex:1;">
          <label style="display:flex; align-items:center; gap:4px; color:#ddd; font-size:12px; cursor:pointer; margin:0; user-select:none;">
            <input type="checkbox" id="chkIsGNP" onchange="toggleGNP()" style="width:auto; margin:0;"> ГНП
          </label>
        </div>
      </div>
      <div class="form-group">
        <label>Длина трассы L (м)</label>
        <input type="number" id="inpLength" value="60" step="1" onchange="triggerUpdate()">
      </div>
    </div>

    <!-- Рельеф -->
    <div class="section-title">Отметки рельефа (ПК, Z)</div>
    <div id="terrainContainer"></div>
    <button class="btn-add-net" style="margin-bottom:12px;" onclick="addTerrainPoint()">+ Добавить точку рельефа</button>

    <div class="section-title">Уровни и приямки</div>
    <div class="form-row">
      <div class="form-group">
        <label>Вход (Глуб. от земли)</label>
        <input type="number" id="inpEntryDepth" value="1.0" step="0.1" onchange="triggerUpdate()">
      </div>
      <div class="form-group">
        <label>Выход (Глуб. от земли)</label>
        <input type="number" id="inpExitDepth" value="1.0" step="0.1" onchange="triggerUpdate()">
      </div>
    </div>

    <div class="form-row" style="margin-top: 8px;">
      <div class="form-group">
        <label>Приямок Вход (м)</label>
        <input type="number" id="inpPitDepthEntry" value="2.0" step="0.1" onchange="triggerUpdate()">
      </div>
      <div class="form-group">
        <label>Приямок Выход (м)</label>
        <input type="number" id="inpPitDepthExit" value="2.0" step="0.1" onchange="triggerUpdate()">
      </div>
    </div>

    <div class="form-row" style="margin-top: 8px;">
      <div class="form-group">
        <label>Отметка горизонта (Z)</label>
        <input type="number" id="inpHall" value="95.00" step="0.05" onchange="triggerUpdate()">
      </div>
      <div class="form-group">
        <label>Радиус изгиба (м)</label>
        <input type="number" id="inpRadius" value="14" step="1" onchange="triggerUpdate()">
      </div>
    </div>

    <div class="form-group" style="margin-top: -4px; margin-bottom: 12px;">
      <label style="display:flex; align-items:center; gap:6px; color:#4da3ff; font-size:11px; cursor:pointer;">
        <input type="checkbox" id="chkAutoSnap" checked onchange="triggerUpdate()" style="width:auto; margin:0;">
        Авто-смещение при нарушении (зазор 0.5м)
      </label>
    </div>
  </div>
</div>

<!-- ЦЕНТРАЛЬНАЯ ПАНЕЛЬ (ЧЕРТЕЖ) -->
<div class="viewport" id="viewportArea">
  <div class="zoom-toolbar">
    <button class="btn-zoom" onclick="zoomIn()">+</button>
    <button class="btn-zoom" onclick="zoomOut()">−</button>
    <span class="zoom-val" id="zoomValLabel">85%</span>
    <button class="btn-zoom" onclick="resetZoom(1.0)">100%</button>
    <button class="btn-zoom" onclick="fitToScreen()">По размеру</button>
  </div>
  <div class="sheet-wrapper" id="sheetWrapper"></div>
</div>

<!-- ПРАВАЯ ПАНЕЛЬ (КОММУНИКАЦИИ И ЭКСПОРТ) -->
<div class="sidebar right-sidebar">
  <div class="sidebar-header">
    <h2>🛠 Коммуникации и экспорт</h2>
  </div>

  <div class="sidebar-body">
    <!-- АСФАЛЬТ И ДЕРЕВЬЯ -->
    <div class="section-title">Зоны асфальта (Горизонтальные)</div>
    <div id="asphaltsContainer"></div>
    <button class="btn-add-net" style="margin-bottom:12px;" onclick="addAsphalt()">+ Добавить участок асфальта</button>
    
    <div class="section-title">Деревья (По рельефу)</div>
    <div id="treesContainer"></div>
    <button class="btn-add-net" style="margin-bottom:12px;" onclick="addTree()">+ Добавить деревья</button>
    <div style="font-size: 10.5px; color: #777; margin-bottom: 12px;">*Зеленые зоны (газон) строятся автоматически там, где нет асфальта.</div>

    <div class="section-title">
      <span>Пересекаемые сети</span>
      <span id="netsCountBadge" style="color: #888; font-size: 11px;">0 сетей</span>
    </div>
    <div id="netsContainer"></div>
    
    <button class="btn-add-net" onclick="addNetPrompt()">+ Добавить сети (Пошаговый мастер)</button>
    <button class="btn-add-net" style="margin-top: 8px;" onclick="openSingleNetModal()">+ Добавить пересекаемую коммуникацию</button>
  </div>

  <div class="sidebar-footer">
    <div class="export-group" style="margin-bottom: 12px;">
      <button class="btn-danger" style="flex:1; padding: 8px; font-size: 11px;" onclick="resetData()">🗑 Очистить текущий</button>
      <button class="btn-danger" style="flex:1; padding: 8px; font-size: 11px;" onclick="resetAllData()">🚨 Удалить все профили</button>
    </div>

    <button class="btn-primary" onclick="printPureSheet()">🖨️ Сохранить в PDF текущий профиль</button>
    <button class="btn-success" id="btnCopy" style="margin-top: 8px;" onclick="copyToClipboard()">📋 Копировать как картинку</button>
    <button class="btn-primary" style="margin-top: 8px;" onclick="printAllSheets()">🖨️ Сохранить все профили</button>
    
    <div class="export-group" style="margin-top: 8px;">
      <button class="btn-secondary" onclick="autoSetDepth5m(); triggerUpdate();">Сброс горизонта на 5.0м</button>
      <button class="btn-secondary" onclick="autoOptimizeDepth()">Углубить под сети</button>
    </div>
    <div class="export-group" style="margin-top: 4px;">
      <button class="btn-secondary" onclick="saveProject()">💾 Сохранить весь проект (.json)</button>
      <button class="btn-secondary" onclick="document.getElementById('fileInput').click()">📂 Загрузить проект</button>
      <input type="file" id="fileInput" accept=".json" style="display: none;" onchange="loadProject(event)">
    </div>
  </div>
</div>

<div id="multiPrintArea"></div>

<script>
let profiles = [];
let activeProfileIdx = 0;
let state = null;

const NET_TYPES = {
  power: { label: 'Электрокабель', defaultDepth: 0.7, color: '#ff0000', badge: 'badge-power' },
  comm:  { label: 'Кабель связи', defaultDepth: 0.7, color: '#ba68c8', badge: 'badge-comm' },
  gas:   { label: 'Газопровод', defaultDepth: 2.0, color: '#00008b', badge: 'badge-gas' },
  water: { label: 'Водопровод', defaultDepth: 2.0, color: '#006400', badge: 'badge-water' },
  sewer: { label: 'Канализация', defaultDepth: 2.0, color: '#8b4513', badge: 'badge-sewer' },
  heat:  { label: 'Теплосеть', defaultDepth: 2.0, color: '#000000', badge: 'badge-heat' }
};

function getDefaultProfile(isGNP = false, numStr = "1") {
  return {
    hddNumber: numStr,
    isGNP: isGNP,
    length: 60,
    depthHall: 95.00,
    entryDepth: 1.0,
    exitDepth: 1.0,
    radius: 14,
    pitDepthEntry: isGNP ? 1.0 : 2.0,
    pitDepthExit: isGNP ? 1.0 : 2.0,
    terrain: [ {x: 0, z: 100.00}, {x: 60, z: 100.00} ],
    asphalts: [],
    trees: [],
    nets: []
  };
}

/* --- ЭКСПОРТ В КАРТИНКУ (БУФЕР ОБМЕНА) --- */
function copyToClipboard() {
    const btn = document.getElementById('btnCopy');
    const orig = btn.innerHTML;
    btn.innerHTML = '⏳ Копирование...';
    btn.disabled = true;

    try {
        const wrapper = document.getElementById('sheetWrapper');
        const savedZoom = wrapper.style.transform;
        wrapper.style.transform = 'none';

        const makeImagePromise = async () => {
            if (typeof html2canvas === 'undefined') {
                await new Promise((resolve, reject) => {
                    let script = document.createElement('script');
                    script.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
                    script.onload = resolve;
                    script.onerror = reject;
                    document.head.appendChild(script);
                });
            }
            
            const sheet = document.querySelector('.sheet');
            const canvas = await html2canvas(sheet, { scale: 1.5, backgroundColor: '#ffffff', useCORS: true });
            wrapper.style.transform = savedZoom;
            
            return new Promise((resolve) => {
                canvas.toBlob(blob => resolve(blob), 'image/png');
            });
        };

        const blobPromise = makeImagePromise();

        navigator.clipboard.write([
            new ClipboardItem({ 'image/png': blobPromise })
        ]).then(() => {
            btn.innerHTML = '✅ Скопировано!';
            setTimeout(() => { btn.innerHTML = orig; btn.disabled = false; }, 3000);
        }).catch(async (err) => {
            const blob = await blobPromise;
            downloadPngFallback(blob);
            btn.innerHTML = '✅ Скачано!';
            setTimeout(() => { btn.innerHTML = orig; btn.disabled = false; }, 3000);
        });

    } catch(e) {
        alert('Ваш браузер не поддерживает прямое копирование картинок. Обновите браузер.');
        btn.innerHTML = orig;
        btn.disabled = false;
    }
}

/* --- ЛОГИКА НУМЕРАЦИИ --- */
function getNextNumber(isGNP, excludeProfile = null) {
    let maxNum = 0;
    profiles.forEach(p => {
        if (p !== excludeProfile && !!p.isGNP === isGNP) {
            let num = parseInt(p.hddNumber);
            if (!isNaN(num) && num > maxNum) {
                maxNum = num;
            }
        }
    });
    return (maxNum + 1).toString();
}

function sortProfiles() {
    if (profiles.length <= 1) return;
    let currentProf = profiles[activeProfileIdx];
    profiles.sort((a, b) => {
        if (!!a.isGNP !== !!b.isGNP) {
            return a.isGNP ? 1 : -1; 
        }
        return parseInt(a.hddNumber) - parseInt(b.hddNumber);
    });
    activeProfileIdx = profiles.indexOf(currentProf);
}

/* --- МАТЕМАТИКА СПЛАЙНОВ (ПЛАВНЫЙ РЕЛЬЕФ) --- */
function createSplineInterpolator(pts) {
    let n = pts.length;
    if (n === 0) return (x) => 100.0;
    if (n === 1) return (x) => pts[0].z;
    
    let dx = [], dy = [], slope = [], m = [];
    for (let i = 0; i < n - 1; i++) {
        dx.push(pts[i+1].x - pts[i].x);
        dy.push(pts[i+1].z - pts[i].z);
        slope.push(dx[i] === 0 ? 0 : dy[i] / dx[i]);
    }
    
    for (let i = 0; i < n; i++) {
        if (i === 0) m.push(slope[0]);
        else if (i === n - 1) m.push(slope[n-2]);
        else {
            if (slope[i-1] * slope[i] <= 0) m.push(0);
            else {
                let w1 = 2 * dx[i] + dx[i-1];
                let w2 = dx[i] + 2 * dx[i-1];
                m.push((w1 + w2) / (w1 / slope[i-1] + w2 / slope[i]));
            }
        }
    }
    
    return function(x) {
        if (x <= pts[0].x) return pts[0].z;
        if (x >= pts[n-1].x) return pts[n-1].z;
        
        let i = 0;
        while (i < n - 2 && x > pts[i+1].x) i++;
        
        let h = dx[i];
        if (h === 0) return pts[i].z;
        
        let t = (x - pts[i].x) / h;
        let t2 = t * t;
        let t3 = t2 * t;

        let h00 = 2*t3 - 3*t2 + 1;
        let h10 = t3 - 2*t2 + t;
        let h01 = -2*t3 + 3*t2;
        let h11 = t3 - t2;

        return h00 * pts[i].z + h10 * h * m[i] + h01 * pts[i+1].z + h11 * h * m[i+1];
    };
}

function getTerrainInterpolator(s) {
    let basePts = s.terrain.map(p => ({x: p.x, z: p.z}));
    basePts.sort((a,b) => a.x - b.x);
    let baseSpline = createSplineInterpolator(basePts);
    
    let pts = [];
    basePts.forEach(p => pts.push({x: p.x, z: p.z}));
    s.asphalts.forEach(a => {
        pts.push({x: a.start, z: baseSpline(a.start)});
        pts.push({x: a.end, z: baseSpline(a.end)});
    });
    pts.sort((a,b) => a.x - b.x);
    
    let unique = [pts[0]];
    for(let i=1; i<pts.length; i++) {
        if(Math.abs(pts[i].x - unique[unique.length-1].x) > 0.001) {
            unique.push(pts[i]);
        }
    }
    
    let eff = [];
    for(let i=0; i<unique.length; i++) {
        let pt = {x: unique[i].x, z: unique[i].z};
        for(let a of s.asphalts) {
            if (pt.x > a.start && pt.x <= a.end) {
                pt.z = baseSpline(a.start);
            }
        }
        eff.push(pt);
    }
    return createSplineInterpolator(eff);
}

function getTruePipeDepth(x, zHall, entryDepth, exitDepth, L, R, getZ, isGNP) {
    let zEnt = getZ(0) - entryDepth;
    let zEx = getZ(L) - exitDepth;

    if (isGNP) {
        if (x <= 0) return zEnt;
        if (x >= L) return zEx;
        return zEnt + (zEx - zEnt) * (x / L);
    }

    if (x <= 0) return zEnt;
    if (x >= L) return zEx;

    let h1 = Math.max(0, zEnt - zHall);
    let L1 = Math.sqrt(Math.max(0, 2 * R * h1 - h1 * h1));
    let h2 = Math.max(0, zEx - zHall);
    let L2 = Math.sqrt(Math.max(0, 2 * R * h2 - h2 * h2));

    let xHorizStart = L1;
    let xHorizEnd = L - L2;

    if (xHorizStart > xHorizEnd) return zHall; 

    if (x < xHorizStart) {
        let dx = xHorizStart - x;
        return zHall + R - Math.sqrt(Math.max(0, R * R - dx * dx));
    } else if (x > xHorizEnd) {
        let dx = x - xHorizEnd;
        return zHall + R - Math.sqrt(Math.max(0, R * R - dx * dx));
    } else {
        return zHall;
    }
}

function snapToSafeDepth(targetZ) {
    if (state.nets.length === 0 || state.isGNP) return targetZ;

    const L = state.length;
    const R = state.radius;
    const clearance = 0.58; 
    let getZ = getTerrainInterpolator(state);

    function isValid(zH) {
        let zEnt = getZ(0) - state.entryDepth;
        let zEx = getZ(L) - state.exitDepth;
        
        if (zH > zEnt || zH > zEx) return false;
        
        let h1 = zEnt - zH;
        let L1 = Math.sqrt(Math.max(0, 2*R*h1 - h1*h1));
        let h2 = zEx - zH;
        let L2 = Math.sqrt(Math.max(0, 2*R*h2 - h2*h2));
        if (L1 + L2 > L) return false;

        for (let net of state.nets) {
            let pipeZ = getTruePipeDepth(net.dist, zH, state.entryDepth, state.exitDepth, L, R, getZ, state.isGNP);
            let netZ = getZ(net.dist) - net.depth;
            if (Math.abs(pipeZ - netZ) < clearance) return false;
        }
        return true;
    }

    if (isValid(targetZ)) return targetZ;

    for (let step = 0; step <= 25.0; step += 0.05) {
        let testZ = targetZ - step;
        if (isValid(testZ)) return testZ;
    }
    return null;
}

function autoSetDepth5m() {
  if (!state || state.isGNP) return;
  let getZ = getTerrainInterpolator(state);
  let minZ = getZ(0);
  for (let x = 0.5; x <= state.length; x += 0.5) {
      let z = getZ(x);
      if (z < minZ) minZ = z;
  }
  state.depthHall = minZ - 5.0;
  document.getElementById('inpHall').value = state.depthHall.toFixed(2);
}

/* ЛОГИКА ВКЛАДОК И ДАННЫХ */
function renderTabs() {
  const container = document.getElementById('tabsContainer');
  container.innerHTML = '';
  
  profiles.forEach((p, idx) => {
      const btn = document.createElement('div');
      btn.className = `tab-btn ${idx === activeProfileIdx ? 'active' : ''}`;
      btn.onclick = () => switchTab(idx);
      btn.innerHTML = `${p.isGNP ? 'ГНП' : 'ГНБ'} №${p.hddNumber}`;
      
      if (profiles.length > 1) {
          const delBtn = document.createElement('span');
          delBtn.className = 'tab-del';
          delBtn.innerHTML = '×';
          delBtn.onclick = (e) => { e.stopPropagation(); deleteTab(idx); };
          btn.appendChild(delBtn);
      }
      container.appendChild(btn);
  });
  
  const addBtn = document.createElement('button');
  addBtn.className = 'tab-add';
  addBtn.innerHTML = '+';
  addBtn.onclick = addNewTab;
  container.appendChild(addBtn);
}

function switchTab(idx) {
  activeProfileIdx = idx;
  state = profiles[activeProfileIdx];
  if(!state.terrain || state.terrain.length === 0) state.terrain = [ {x:0, z:100.0}, {x:state.length, z:100.0} ];
  state.terrain.sort((a,b) => a.x - b.x);
  
  renderTabs(); 
  syncInputs();
  renderTerrainList();
  renderAsphaltsList();
  renderTreesList();
  renderNetsList();
  triggerUpdate();
}

function addNewTab() {
  let isGNP = false;
  let nextNum = getNextNumber(isGNP); // Создаем ГНБ по умолчанию
  let newProf = getDefaultProfile(isGNP, nextNum);
  profiles.push(newProf);
  sortProfiles();
  activeProfileIdx = profiles.indexOf(newProf);
  switchTab(activeProfileIdx);
}

function deleteTab(idx) {
  if (profiles.length <= 1) return;
  if (confirm(`Вы действительно хотите удалить вкладку ${profiles[idx].isGNP ? 'ГНП' : 'ГНБ'} №${profiles[idx].hddNumber}?`)) {
      profiles.splice(idx, 1);
      if (activeProfileIdx >= profiles.length) activeProfileIdx = profiles.length - 1;
      else if (activeProfileIdx > idx) activeProfileIdx--; 
      switchTab(activeProfileIdx);
  }
}

function resetData(confirmPrompt = true) {
  if (confirmPrompt && !confirm(`Очистить ${state.isGNP ? 'ГНП' : 'ГНБ'} №${state.hddNumber}? Все данные на этой вкладке будут удалены.`)) return;
  profiles[activeProfileIdx] = getDefaultProfile(state.isGNP, state.hddNumber);
  state = profiles[activeProfileIdx];
  switchTab(activeProfileIdx);
}

function resetAllData() {
  if (confirm("Вы уверены, что хотите БЕЗВОЗВРАТНО удалить ВСЕ вкладки и очистить проект?")) {
    profiles = [getDefaultProfile(false, "1")];
    activeProfileIdx = 0;
    localStorage.removeItem('gnbProfilesArray');
    localStorage.removeItem('gnbActiveIndex');
    switchTab(0);
  }
}

function saveProject() {
    const dataToSave = { version: "2.4", profiles: profiles, activeIndex: activeProfileIdx };
    const blob = new Blob([JSON.stringify(dataToSave, null, 2)], { type: "application/json" });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `Проект_ГНБ_ГНП_(${profiles.length}_шт).json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

function loadProject(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const loaded = JSON.parse(e.target.result);
            if (loaded.profiles) {
                profiles = loaded.profiles;
                activeProfileIdx = loaded.activeIndex || 0;
            } else if (loaded.length !== undefined) {
                profiles = [loaded];
                activeProfileIdx = 0;
            } else {
                alert("Неверный формат файла.");
                return;
            }
            
            profiles.forEach(p => {
                if (p.isGNP === undefined) p.isGNP = false;
                if (!p.hddNumber) p.hddNumber = "1";
                if (p.pitDepthEntry === undefined) p.pitDepthEntry = p.pitDepth !== undefined ? p.pitDepth : 2.0;
                if (p.pitDepthExit === undefined) p.pitDepthExit = p.pitDepth !== undefined ? p.pitDepth : 2.0;
                if (p.radius === undefined) p.radius = 14; 
                if (!p.asphalts) p.asphalts = [];
                if (!p.trees) p.trees = []; 
                if (!p.nets) p.nets = [];
                if (!p.terrain) {
                    p.terrain = [ {x:0, z:100.0}, {x:p.length, z:100.0} ];
                    if (p.depthHall && p.depthHall > 0 && p.depthHall < 20) p.depthHall = 100.0 - p.depthHall;
                }
            });
            sortProfiles();
            if (activeProfileIdx >= profiles.length) activeProfileIdx = 0;
            switchTab(activeProfileIdx);
        } catch (err) { alert("Ошибка при чтении файла проекта!"); }
        event.target.value = ''; 
    };
    reader.readAsText(file);
}

function toggleGNP() {
    let isGNP = document.getElementById('chkIsGNP').checked;
    if (!!state.isGNP === isGNP) return;
    
    let newNum = getNextNumber(isGNP, state);
    
    state.isGNP = isGNP;
    state.hddNumber = newNum;
    
    if (isGNP) {
        state.entryDepth = 1.0;
        state.exitDepth = 1.0;
        state.pitDepthEntry = 1.0;
        state.pitDepthExit = 1.0;
    }
    
    sortProfiles();
    renderTabs();
    syncInputs();
    triggerUpdate();
}

function syncInputs() {
  document.getElementById('chkIsGNP').checked = !!state.isGNP;
  document.getElementById('inpNumber').value = state.hddNumber;
  document.getElementById('inpLength').value = state.length;
  document.getElementById('inpHall').value = state.depthHall.toFixed(2);
  document.getElementById('inpEntryDepth').value = state.entryDepth;
  document.getElementById('inpExitDepth').value = state.exitDepth;
  document.getElementById('inpRadius').value = state.radius !== undefined ? state.radius : 14;
  
  document.getElementById('inpPitDepthEntry').value = state.pitDepthEntry !== undefined ? state.pitDepthEntry : 2.0;
  document.getElementById('inpPitDepthExit').value = state.pitDepthExit !== undefined ? state.pitDepthExit : 2.0;

  let hallInp = document.getElementById('inpHall');
  let radInp = document.getElementById('inpRadius');
  if (state.isGNP) {
      hallInp.disabled = true;
      radInp.disabled = true;
  } else {
      hallInp.disabled = false;
      radInp.disabled = false;
  }
}

function triggerUpdate() {
  let oldNumber = state.hddNumber;
  state.hddNumber = document.getElementById('inpNumber').value || "1";
  state.length = parseFloat(document.getElementById('inpLength').value) || 60;
  let userZ = parseFloat(document.getElementById('inpHall').value) || 95.00;
  state.entryDepth = parseFloat(document.getElementById('inpEntryDepth').value) || 1.0;
  state.exitDepth = parseFloat(document.getElementById('inpExitDepth').value) || 1.0;
  state.radius = parseFloat(document.getElementById('inpRadius').value) || 14;
  
  state.pitDepthEntry = parseFloat(document.getElementById('inpPitDepthEntry').value) || 2.0;
  state.pitDepthExit = parseFloat(document.getElementById('inpPitDepthExit').value) || 2.0;

  state.terrain.sort((a,b) => a.x - b.x);

  if (!state.isGNP && document.getElementById('chkAutoSnap').checked && state.nets.length > 0) {
      let safeZ = snapToSafeDepth(userZ);
      if (safeZ !== null && Math.abs(safeZ - userZ) > 0.01) {
          state.depthHall = +(safeZ.toFixed(2));
          document.getElementById('inpHall').value = state.depthHall.toFixed(2);
      } else {
          state.depthHall = userZ;
      }
  } else {
      state.depthHall = userZ;
  }

  if (oldNumber !== state.hddNumber) {
      sortProfiles();
      renderTabs(); 
  }

  localStorage.setItem('gnbProfilesArray', JSON.stringify(profiles));
  localStorage.setItem('gnbActiveIndex', activeProfileIdx);

  renderSvg();
}

function addNetPrompt() {
  const wizardSteps = [
    { id: 'power', defaultName: 'Электрокабель', defaultDepth: 0.7 },
    { id: 'gas', defaultName: 'Газопровод', defaultDepth: 2.0 },
    { id: 'water', defaultName: 'Водопровод', defaultDepth: 2.0 },
    { id: 'sewer', defaultName: 'Канализация', defaultDepth: 2.0 },
    { id: 'heat', defaultName: 'Теплотрасса', defaultDepth: 2.0 },
    { id: 'comm', defaultName: 'Кабель связи', defaultDepth: 0.7 }
  ];
  let addedAny = false;
  for (let step of wizardSteps) {
    let countInput = prompt(`ШАГ: ${step.defaultName}\nСколько пересечений на трассе? (0 чтобы пропустить)`, "0");
    if (countInput === null) break; 
    let count = parseInt(countInput) || 0;
    for (let j = 0; j < count; j++) {
       let distInput = prompt(`📍 Пикет (ПК) для "${step.defaultName}" (${j + 1}/${count}):`, "");
       if (distInput !== null && distInput.trim() !== "") {
           state.nets.push({
               type: step.id,
               name: step.defaultName + (count > 1 ? ` ${j + 1}` : ''),
               dist: parseFloat(distInput.replace(',', '.')) || 0,
               depth: step.defaultDepth
           });
           addedAny = true;
       }
    }
  }
  if (addedAny) { renderNetsList(); triggerUpdate(); }
}

function openSingleNetModal() {
  document.getElementById('singleNetModal').style.display = 'flex';
  document.getElementById('modalNetDist').value = ''; 
  document.getElementById('modalNetDist').focus();
}
function closeSingleNetModal() { document.getElementById('singleNetModal').style.display = 'none'; }
function confirmSingleNet() {
  const type = document.getElementById('modalNetType').value;
  const dist = parseFloat(document.getElementById('modalNetDist').value.replace(',', '.')) || 0;
  const conf = NET_TYPES[type];
  const sameTypeCount = state.nets.filter(n => n.type === type).length;
  state.nets.push({
    type: type,
    name: conf.label + (sameTypeCount > 0 ? ` ${sameTypeCount + 1}` : ''),
    dist: dist,
    depth: conf.defaultDepth
  });
  document.getElementById('modalNetDist').value = '';
  document.getElementById('modalNetDist').focus();
  renderNetsList();
  triggerUpdate();
}
document.getElementById('modalNetDist').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') confirmSingleNet();
});

function autoOptimizeDepth() {
  if (state.isGNP) {
      alert("В режиме ГНП авто-углубление недоступно (трасса прямая). Измените глубину входа и выхода вручную.");
      return;
  }
  if (state.nets.length === 0) { alert("Нет сетей для обхода!"); return; }
  
  let targetZ = state.depthHall; 
  let safeZ = snapToSafeDepth(targetZ + 1.0); 
  if (safeZ) {
      state.depthHall = +(safeZ.toFixed(2));
      document.getElementById('inpHall').value = state.depthHall.toFixed(2);
      triggerUpdate();
      alert(`Горизонт перенесен на безопасную отметку: Z = ${state.depthHall} м.`);
  } else {
      alert("Не удалось найти безопасную отметку ниже всех сетей. Проверьте радиус.");
  }
}

let currentZoom = 0.85;
function applyZoom() {
  document.getElementById('sheetWrapper').style.transform = `scale(${currentZoom})`;
  document.getElementById('zoomValLabel').textContent = Math.round(currentZoom * 100) + '%';
}
function zoomIn() { currentZoom = Math.min(2.5, currentZoom + 0.1); applyZoom(); }
function zoomOut() { currentZoom = Math.max(0.3, currentZoom - 0.1); applyZoom(); }
function resetZoom(val = 1.0) { currentZoom = val; applyZoom(); }
function fitToScreen() {
  const vp = document.getElementById('viewportArea');
  const ratioW = (vp.clientWidth - 48) / 1587;
  const ratioH = (vp.clientHeight - 48) / 1122;
  currentZoom = Math.max(0.3, Math.min(1.5, +(Math.min(ratioW, ratioH)).toFixed(2)));
  applyZoom();
}
document.getElementById('viewportArea').addEventListener('wheel', function(e) {
  if (e.ctrlKey || e.metaKey) { e.preventDefault(); if (e.deltaY < 0) zoomIn(); else zoomOut(); }
}, { passive: false });


/* --- ГЕНЕРАЦИЯ SVG ЧЕРТЕЖА --- */
function getProfileHtml(s, isMultiPrint) {
  const L = s.length;
  const R = s.radius;
  
  let getZ = getTerrainInterpolator(s); 
  
  let zEnt = getZ(0) - s.entryDepth;
  let zEx = getZ(L) - s.exitDepth;
  
  let allZ = [];
  for(let x=0; x<=L; x+=1) allZ.push(getZ(x));
  
  let pipeMinZ = s.isGNP ? Math.min(zEnt, zEx) : Math.min(zEnt, zEx, s.depthHall);
  allZ.push(pipeMinZ - 3); 
  
  s.nets.forEach(n => allZ.push(getZ(n.dist) - n.depth));
  
  let maxZ = Math.ceil(Math.max(...allZ)) + 1;
  let minZ = Math.floor(Math.min(...allZ));
  
  const leftX = 100;
  const rightX = 1510;
  const scaleX = (rightX - leftX) / L;
  const toSvgX = (dist) => leftX + (dist * scaleX);
  
  const scaleY = 60;
  const startY = 200; 
  const toSvgY = (absElev) => startY + (maxZ - absElev) * scaleY;
  
  let gridBottomY = toSvgY(minZ);

  let markup = '';
  let gridLines = '';
  let gridTextsX = ''; 
  let xPts = [];
  
  let gridStep = 5;
  if (L <= 30) {
      gridStep = 1;
  } else if (L <= 80) {
      gridStep = 2;
  } else if (L <= 150) {
      gridStep = 5;
  } else if (L <= 300) {
      gridStep = 10;
  } else {
      gridStep = 20;
  }
  
  for (let x = 0; x <= L; x += gridStep) xPts.push(x);
  if (L % gridStep !== 0) xPts.push(L);
  
  xPts.forEach(x => {
      let px = toSvgX(x);
      gridLines += `<line x1="${px}" y1="${startY}" x2="${px}" y2="${gridBottomY}" stroke-dasharray="3,3" />`;
      gridTextsX += `<text x="${px}" y="${gridBottomY + 18}" font-size="13">${x}</text>`; /* ШРИФТ УВЕЛИЧЕН ДО 13 */
  });

  markup += `<g stroke="rgb(128, 128, 128)" stroke-width="1.2">${gridLines}`;
  for (let z = minZ; z <= maxZ; z++) {
      let gy = toSvgY(z);
      markup += `<line x1="${leftX-20}" y1="${gy}" x2="${rightX+20}" y2="${gy}" stroke-dasharray="3,3" />`;
  }
  markup += `</g>`;

  markup += `<g font-size="14" fill="#444" text-anchor="end">`; /* ШРИФТ УВЕЛИЧЕН ДО 14 */
  for (let z = minZ; z <= maxZ; z++) {
      let gy = toSvgY(z);
      markup += `<text x="${leftX-28}" y="${gy+5}">${z.toFixed(2)}</text>`;
  }
  markup += `</g>`;

  markup += `
    <g font-size="13" fill="#666" text-anchor="middle">
      ${gridTextsX}
    </g>
    <text x="${leftX-28}" y="${gridBottomY+18}" font-size="13" fill="#444" font-weight="bold" text-anchor="end">ПК (м):</text>
  `; /* ШРИФТ УВЕЛИЧЕН ДО 13 */

  let groundPathD = `M ${toSvgX(0)} ${toSvgY(getZ(0))}`;
  for (let x = 0.5; x <= L; x += 0.5) {
      groundPathD += ` L ${toSvgX(x)} ${toSvgY(getZ(x))}`;
  }
  markup += `<path d="${groundPathD}" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round" />`;

  let rawAsphalts = s.asphalts.map(a => ({ start: Math.max(0, Math.min(L, a.start)), end: Math.max(0, Math.min(L, a.end)) }))
                              .filter(a => a.start < a.end).sort((a,b) => a.start - b.start);
  
  let asphalts = [];
  if (rawAsphalts.length > 0) {
      let current = rawAsphalts[0];
      for (let i = 1; i < rawAsphalts.length; i++) {
          if (rawAsphalts[i].start <= current.end) current.end = Math.max(current.end, rawAsphalts[i].end);
          else { asphalts.push(current); current = rawAsphalts[i]; }
      }
      asphalts.push(current);
  }

  let grasses = [];
  let currentPos = 0;
  asphalts.forEach(a => {
      if (a.start > currentPos) grasses.push({ start: currentPos, end: a.start });
      currentPos = a.end;
  });
  if (currentPos < L) grasses.push({ start: currentPos, end: L });

  grasses.forEach(g => {
    let grassPath = `M ${toSvgX(g.start)} ${toSvgY(getZ(g.start))}`;
    for (let x = g.start + 0.5; x <= g.end; x += 0.5) grassPath += ` L ${toSvgX(x)} ${toSvgY(getZ(x))}`;
    
    markup += `
      <path d="${grassPath}" fill="none" stroke="#d4edda" stroke-width="8" transform="translate(0, -4)" stroke-linejoin="round" />
      <path d="${grassPath}" fill="none" stroke="#28a745" stroke-width="1.5" transform="translate(0, -8)" stroke-linejoin="round" />
      <text x="${toSvgX((g.start+g.end)/2)}" y="${toSvgY(getZ((g.start+g.end)/2)) - 16}" text-anchor="middle" font-size="14" font-weight="bold" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">Газон</text>
      <text x="${toSvgX((g.start+g.end)/2)}" y="${toSvgY(getZ((g.start+g.end)/2)) - 16}" text-anchor="middle" font-size="14" font-weight="bold" fill="#28a745">Газон</text>
    `; /* ШРИФТ УВЕЛИЧЕН ДО 14 */
  });

  asphalts.forEach(a => {
    const y = toSvgY(getZ(a.start));
    const w = toSvgX(a.end) - toSvgX(a.start);
    markup += `
      <rect x="${toSvgX(a.start)-2}" y="${y-16}" width="4" height="16" fill="#333" />
      <rect x="${toSvgX(a.start)}" y="${y-10}" width="${w}" height="10" fill="url(#asphaltHatch_${s.hddNumber})" stroke="#111" stroke-width="1.8" />
      <rect x="${toSvgX(a.end)-2}" y="${y-16}" width="4" height="16" fill="#333" />
      <text x="${toSvgX((a.start+a.end)/2)}" y="${y-18}" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Асфальтобетон</text>
    `; /* ШРИФТ УВЕЛИЧЕН ДО 14 */
  });

  let rawTrees = s.trees.map(t => ({ start: Math.max(0, Math.min(L, t.start)), end: Math.max(0, Math.min(L, t.end)) }))
                        .filter(t => t.start < t.end).sort((a,b) => a.start - b.start);

  rawTrees.forEach(t => {
      for(let px = t.start; px <= t.end; px += 4) {
          let tx = toSvgX(px);
          let ty = toSvgY(getZ(px)) - 6;
          markup += `
            <line x1="${tx}" y1="${ty}" x2="${tx}" y2="${ty-14}" stroke="#795548" stroke-width="2.5" />
            <circle cx="${tx}" cy="${ty-18}" r="6.5" fill="#81c784" stroke="#2e7d32" stroke-width="1" />
            <circle cx="${tx-5}" cy="${ty-13}" r="5" fill="#81c784" stroke="#2e7d32" stroke-width="1" />
            <circle cx="${tx+5}" cy="${ty-13}" r="5" fill="#81c784" stroke="#2e7d32" stroke-width="1" />
          `;
      }
      let midX = (t.start+t.end)/2;
      let midY = toSvgY(getZ(midX)) - 38;
      markup += `
        <text x="${toSvgX(midX)}" y="${midY}" text-anchor="middle" font-size="14" font-weight="bold" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">Зеленые насаждения</text>
        <text x="${toSvgX(midX)}" y="${midY}" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">Зеленые насаждения</text>
      `; /* ШРИФТ УВЕЛИЧЕН ДО 14 */
  });

  const pitWidthPx = 15; 
  const pitDepthEntryPx = (s.pitDepthEntry !== undefined ? s.pitDepthEntry : 2.0) * scaleY;
  const pitDepthExitPx = (s.pitDepthExit !== undefined ? s.pitDepthExit : 2.0) * scaleY;
  const startPitY = toSvgY(getZ(0));
  const endPitY = toSvgY(getZ(L));
  
  markup += `
    <rect x="${toSvgX(0) - pitWidthPx}" y="${startPitY}" width="${pitWidthPx}" height="${pitDepthEntryPx}" fill="url(#pitHatch_${s.hddNumber})" stroke="#ff00ff" stroke-width="1.5" />
    <line x1="${toSvgX(0)}" y1="${startPitY}" x2="${toSvgX(0)}" y2="${startPitY+pitDepthEntryPx}" stroke="#ff00ff" stroke-width="2.5" />
    
    <rect x="${toSvgX(L)}" y="${endPitY}" width="${pitWidthPx}" height="${pitDepthExitPx}" fill="url(#pitHatch_${s.hddNumber})" stroke="#ff00ff" stroke-width="1.5" />
    <line x1="${toSvgX(L)}" y1="${endPitY}" x2="${toSvgX(L)}" y2="${endPitY+pitDepthExitPx}" stroke="#ff00ff" stroke-width="2.5" />
  `;

  let pathD = `M ${toSvgX(0)} ${toSvgY(getZ(0) - s.entryDepth)}`;
  for (let x = 0.5; x <= L; x += 0.5) {
      let zPipe = getTruePipeDepth(x, s.depthHall, s.entryDepth, s.exitDepth, L, R, getZ, s.isGNP);
      pathD += ` L ${toSvgX(x)} ${toSvgY(zPipe)}`;
  }
  let yEx = getTruePipeDepth(L, s.depthHall, s.entryDepth, s.exitDepth, L, R, getZ, s.isGNP);
  pathD += ` L ${toSvgX(L)} ${toSvgY(yEx)}`;

  markup += `
    <path d="${pathD}" fill="none" stroke="#ff00ff" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="${pathD}" fill="none" stroke="#cc00cc" stroke-width="1.8" stroke-dasharray="8,4" stroke-linejoin="round" />
  `;

  markup += `
    <circle cx="${toSvgX(0)}" cy="${toSvgY(zEnt)}" r="4.5" fill="#ff00ff" />
    <circle cx="${toSvgX(L)}" cy="${toSvgY(zEx)}" r="4.5" fill="#ff00ff" />
    
    <text x="${toSvgX(0)}" y="${toSvgY(zEnt) - 12}" font-size="14" fill="#cc00cc" font-weight="bold" text-anchor="middle">Вход (Z: ${zEnt.toFixed(2)}м)</text>
    <text x="${toSvgX(L)}" y="${toSvgY(zEx) - 12}" font-size="14" fill="#cc00cc" font-weight="bold" text-anchor="middle">Выход (Z: ${zEx.toFixed(2)}м)</text>
  `; /* ШРИФТ УВЕЛИЧЕН ДО 14 */

  if (!s.isGNP) {
      let h1 = Math.max(0, zEnt - s.depthHall);
      let L1 = Math.sqrt(Math.max(0, 2 * R * h1 - h1 * h1));
      let h2 = Math.max(0, zEx - s.depthHall);
      let L2 = Math.sqrt(Math.max(0, 2 * R * h2 - h2 * h2));
      markup += `<text x="${toSvgX(L1 + Math.max(0, L - L2 - L1)/2)}" y="${toSvgY(s.depthHall)+22}" font-size="15" fill="#cc00cc" font-weight="bold" text-anchor="middle">Горизонт (Z: ${s.depthHall.toFixed(2)}м)</text>`;
      /* ШРИФТ УВЕЛИЧЕН ДО 15 */
  }

  let linesMarkup = '';
  let textsMarkup = '';
  let drawNets = [...s.nets].sort((a, b) => a.dist - b.dist);

  drawNets.forEach((net) => {
    const nx = toSvgX(net.dist);
    const zGr = getZ(net.dist);
    const nz = zGr - net.depth;
    const ny = toSvgY(nz);
    const conf = NET_TYPES[net.type] || NET_TYPES.gas;
    
    let pipeZAtDist = getTruePipeDepth(net.dist, s.depthHall, s.entryDepth, s.exitDepth, L, R, getZ, s.isGNP);
    const centerDist = Math.abs(pipeZAtDist - nz);
    const deltaHVal = centerDist - 0.080; 
    const deltaHStr = deltaHVal.toFixed(2).replace('.', ',');
    const isUnderNorm = deltaHVal < 0.49; 
    
    const textEndY = gridBottomY + 38; 
    
    const paramStr = `${net.name}, Δh=${deltaHStr}м${isUnderNorm ? ' (! < 0,5м)' : ''}`;
    const textFill = isUnderNorm ? '#d32f2f' : conf.color;
    const textWeight = isUnderNorm ? 'bold' : 'normal';

    linesMarkup += `
      <circle cx="${nx}" cy="${ny}" r="6.5" fill="${conf.color}" stroke="${isUnderNorm ? '#d32f2f' : conf.color}" stroke-width="${isUnderNorm ? '2' : '1.2'}" />
      <line x1="${nx}" y1="${toSvgY(zGr)}" x2="${nx}" y2="${ny - 6.5}" stroke="${conf.color}" stroke-width="1.2" stroke-dasharray="2,2" />
      <line x1="${nx}" y1="${ny + 6.5}" x2="${nx}" y2="${textEndY}" stroke="${conf.color}" stroke-width="1.2" />
    `;

    textsMarkup += `
      <text x="${nx + 5}" y="${textEndY}" font-size="14" font-weight="${textWeight}" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" text-anchor="end" transform="rotate(-90 ${nx + 5} ${textEndY})">${paramStr}</text>
      <text x="${nx + 5}" y="${textEndY}" font-size="14" fill="${textFill}" font-weight="${textWeight}" text-anchor="end" transform="rotate(-90 ${nx + 5} ${textEndY})">${paramStr}</text>
    `; /* ШРИФТ УВЕЛИЧЕН ДО 14 */
  });
  markup += linesMarkup + textsMarkup; 

  // Примечания с увеличенным шрифтом и отступами
  let notesY = 1240;
  markup += `
    <g font-size="18" fill="#333">
      <text x="70" y="${notesY}" font-weight="bold">Примечания:</text>
      <text x="70" y="${notesY+24}">1. Перед началом буровых работ выполнить контрольное шурфование всех пересекаемых</text>
      <text x="85" y="${notesY+48}">коммуникаций в присутствии представителей эксплуатирующих служб.</text>
      <text x="70" y="${notesY+72}">2. Приближение к коммуникациям - в допустимых пределах;</text>
      <text x="70" y="${notesY+96}">3. Приближение к поверхности - в допустимых пределах (>1,0м);</text>
      <text x="70" y="${notesY+120}">4. Искривление штанг - в допустимых пределах (>45,0м).</text>
    </g>
  `; /* ШРИФТ УВЕЛИЧЕН ДО 18 */

  let legendItems = [];
  legendItems.push({
      svg: `<path d="M 0 0 L 30 0" fill="none" stroke="#ff00ff" stroke-width="6" /><path d="M 0 0 L 30 0" fill="none" stroke="#cc00cc" stroke-width="1.5" stroke-dasharray="6,3" />`,
      text: `Проектируемая трасса ${s.isGNP ? 'ГНП' : 'ГНБ'}`
  });
  
  legendItems.push({
      svg: `<rect x="0" y="-8" width="30" height="16" fill="url(#pitHatch_${s.hddNumber})" stroke="#ff00ff" stroke-width="1.5" />`,
      text: "Стартовый / приемный приямок"
  });

  if (s.asphalts.length > 0) {
      legendItems.push({
          svg: `<rect x="0" y="-8" width="30" height="16" fill="url(#asphaltHatch_${s.hddNumber})" stroke="#111" stroke-width="1.5" />`,
          text: "Асфальтобетонное покрытие"
      });
  }

  if (grasses.length > 0) {
      legendItems.push({
          svg: `<rect x="0" y="-4" width="30" height="8" fill="#d4edda" stroke="#28a745" stroke-width="1" />`,
          text: "Проектный рельеф (газон)"
      });
  }

  if (s.trees.length > 0) {
      legendItems.push({
          svg: `<line x1="15" y1="4" x2="15" y2="-6" stroke="#795548" stroke-width="2" />
                <circle cx="15" cy="-9" r="5" fill="#81c784" stroke="#2e7d32" stroke-width="1" />
                <circle cx="11" cy="-5" r="4" fill="#81c784" stroke="#2e7d32" stroke-width="1" />
                <circle cx="19" cy="-5" r="4" fill="#81c784" stroke="#2e7d32" stroke-width="1" />`,
          text: "Зеленые насаждения"
      });
  }

  let uniqueNets = [...new Set(s.nets.map(n => n.type))];
  uniqueNets.forEach(netType => {
      const conf = NET_TYPES[netType];
      legendItems.push({
          svg: `<circle cx="15" cy="0" r="5" fill="${conf.color}" stroke="${conf.color}" stroke-width="1.2" />`,
          text: conf.label
      });
  });

  // Легенда с увеличенным шрифтом
  let legendMarkup = `<g transform="translate(850, ${notesY})">
      <text x="0" y="0" font-size="18" font-weight="bold" fill="#333">Условные обозначения:</text>`;
  
  legendItems.forEach((item, index) => {
      let col = Math.floor(index / 6); 
      let row = index % 6;
      let xOff = col * 320;
      let yOff = 30 + row * 26; // Расширили интервал
      legendMarkup += `
          <g transform="translate(${xOff}, ${yOff})">
              <g transform="translate(0, -4)">${item.svg}</g>
              <text x="40" y="1" font-size="15" fill="#333">${item.text}</text>
          </g>
      `;
  }); /* ТЕКСТ ЛЕГЕНДЫ УВЕЛИЧЕН ДО 15 */
  legendMarkup += `</g>`;

  markup += legendMarkup;

  return `
    <div class="sheet ${isMultiPrint ? 'print-page' : ''}">
      <div class="frame">
        <div class="title-block">
          ПРОДОЛЬНЫЙ ПРОФИЛЬ ЗАКРЫТОГО ПЕРЕХОДА МЕТОДОМ ${s.isGNP ? 'ГНП' : 'ГНБ'} №${s.hddNumber}
          <div class="subtitle">
            Масштаб: вертикальный 1:50, горизонтальный - адаптивный | Длина перехода L = ${L.toFixed(1)} м, количество пересечений - <strong>${s.nets.length}</strong>
          </div>
        </div>
        <div class="svg-container">
          <svg viewBox="0 0 1560 1400">
            <defs>
              <pattern id="pitHatch_${s.hddNumber}" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
                <line x1="0" y1="0" x2="0" y2="8" stroke="#ff00ff" stroke-width="1.2" />
              </pattern>
              <pattern id="asphaltHatch_${s.hddNumber}" width="6" height="6" patternTransform="rotate(-45 0 0)" patternUnits="userSpaceOnUse">
                <line x1="0" y1="0" x2="0" y2="6" stroke="#444" stroke-width="0.8" />
              </pattern>
            </defs>
            ${markup}
          </svg>
        </div>
      </div>
    </div>
  `;
}

function renderSvg() {
  document.getElementById('sheetWrapper').innerHTML = getProfileHtml(state, false);
}

function printPureSheet() {
  const savedZoom = currentZoom;
  document.getElementById('sheetWrapper').style.transform = 'none';
  setTimeout(() => {
    window.print();
    setTimeout(() => { document.getElementById('sheetWrapper').style.transform = `scale(${savedZoom})`; }, 300);
  }, 50);
}

function printAllSheets() {
  const multiArea = document.getElementById('multiPrintArea');
  multiArea.innerHTML = profiles.map(p => getProfileHtml(p, true)).join('');
  document.body.classList.add('print-all-mode');
  setTimeout(() => {
    window.print();
    setTimeout(() => {
      document.body.classList.remove('print-all-mode');
      multiArea.innerHTML = '';
    }, 300);
  }, 50);
}

window.onload = () => {
  const savedArr = localStorage.getItem('gnbProfilesArray');
  const savedIdx = localStorage.getItem('gnbActiveIndex');
  
  if (savedArr) {
    try {
      profiles = JSON.parse(savedArr);
      activeProfileIdx = parseInt(savedIdx) || 0;
      if (activeProfileIdx >= profiles.length) activeProfileIdx = 0;
      
      profiles.forEach(p => {
          if (p.isGNP === undefined) p.isGNP = false;
          if (!p.hddNumber) p.hddNumber = "1";
          if (p.pitDepthEntry === undefined) p.pitDepthEntry = p.pitDepth !== undefined ? p.pitDepth : 2.0;
          if (p.pitDepthExit === undefined) p.pitDepthExit = p.pitDepth !== undefined ? p.pitDepth : 2.0;
          if (p.radius === undefined) p.radius = 14;
          if (!p.asphalts) p.asphalts = [];
          if (!p.trees) p.trees = [];
          if (!p.nets) p.nets = [];
          if (!p.terrain) {
              p.terrain = [ {x:0, z:100.0}, {x:p.length, z:100.0} ];
              if (p.depthHall && p.depthHall > 0 && p.depthHall < 20) p.depthHall = 100.0 - p.depthHall;
          }
      });
      sortProfiles();
      if (activeProfileIdx >= profiles.length) activeProfileIdx = 0;
      switchTab(activeProfileIdx);
    } catch(e) { profiles = [getDefaultProfile(false, "1")]; switchTab(0); }
  } else {
    profiles = [getDefaultProfile(false, "1")];
    switchTab(0);
  }
  
  renderTabs();
  fitToScreen();
};
</script>
