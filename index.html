<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератор профилей ГНБ (КЛ 0,4-10 кВ) - Лист А3</title>
<style>
  @page {
    size: A3 landscape;
    margin: 0;
  }
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "ISOCPEUR", "GOST 2.304 type A", Arial, sans-serif;
    background: #1e1e24;
    color: #e0e0e0;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ЛЕВАЯ ПАНЕЛЬ */
  .sidebar {
    width: 440px;
    min-width: 440px;
    background: #25252d;
    border-right: 1px solid #383844;
    display: flex;
    flex-direction: column;
    height: 100%;
    z-index: 10;
  }
  .sidebar-header {
    padding: 16px 20px;
    background: #1a1a20;
    border-bottom: 1px solid #383844;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sidebar-header h2 {
    margin: 0;
    font-size: 16px;
    color: #fff;
  }
  .sidebar-body {
    padding: 16px 20px;
    overflow-y: auto;
    flex: 1;
  }

  .preset-buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .btn-preset {
    background: #333340;
    color: #aaa;
    border: 1px solid #444455;
    padding: 6px 4px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
    font-weight: 500;
  }
  .btn-preset:hover { background: #3d3d4d; color: #fff; }

  .section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #4da3ff;
    margin: 16px 0 10px;
    font-weight: 700;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .form-group {
    margin-bottom: 12px;
  }
  .form-group label {
    display: block;
    font-size: 12px;
    color: #aaa;
    margin-bottom: 4px;
  }
  .form-row {
    display: flex;
    gap: 8px;
  }
  .form-row .form-group {
    flex: 1;
    margin-bottom: 0;
  }
  input, select {
    width: 100%;
    background: #18181f;
    border: 1px solid #3c3c4a;
    border-radius: 4px;
    padding: 7px 10px;
    color: #fff;
    font-size: 13px;
    outline: none;
  }
  input:focus, select:focus {
    border-color: #007acc;
  }

  .net-item {
    background: #1e1e26;
    border: 1px solid #353545;
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 8px;
  }
  .net-item-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .net-badge {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
    font-weight: bold;
    text-transform: uppercase;
  }
  .badge-gas { background: #b28900; color: #fff; }
  .badge-power { background: #c2185b; color: #fff; }
  .badge-water { background: #0288d1; color: #fff; }
  .badge-sewer { background: #5d4037; color: #fff; }
  .badge-heat { background: #d84315; color: #fff; }
  .badge-comm { background: #7b1fa2; color: #fff; }

  .btn-remove-net {
    background: none;
    border: none;
    color: #ff5252;
    cursor: pointer;
    font-size: 15px;
  }
  .btn-add-net {
    width: 100%;
    background: #2a2a38;
    color: #4da3ff;
    border: 1px dashed #4da3ff;
    padding: 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
    margin-top: 4px;
  }
  .btn-add-net:hover { background: #323245; }

  .sidebar-footer {
    padding: 14px 20px;
    background: #1a1a20;
    border-top: 1px solid #383844;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .btn-primary {
    background: #007acc;
    color: #fff;
    border: none;
    padding: 10px;
    border-radius: 5px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .btn-primary:hover { background: #0066aa; }
  .export-group {
    display: flex;
    gap: 8px;
  }
  .btn-secondary {
    flex: 1;
    background: #333340;
    color: #ddd;
    border: 1px solid #484858;
    padding: 7px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
  }
  .btn-secondary:hover { background: #3d3d4e; color: #fff; }

  /* ПРАВАЯ ОБЛАСТЬ: ПРОСМОТР */
  .viewport {
    flex: 1;
    height: 100%;
    overflow: auto;
    background: #404249;
    padding: 24px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  
  .sheet {
    width: 1587px;
    height: 1122px;
    min-width: 1587px;
    min-height: 1122px;
    background: #ffffff;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    position: relative;
    padding: 38px 19px 19px 76px;
    box-sizing: border-box;
    font-family: "ISOCPEUR", "GOST 2.304 type A", "Segoe UI", Arial, sans
