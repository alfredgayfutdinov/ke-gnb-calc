<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератор профилей ГНБ - Лист А3</title>
<style>
  @page {
    size: A3 landscape;
    margin: 0;
  }
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "ISOCPEUR", "GOST 2.304 type A", Arial, sans-serif;
    background: #1e1e24;
    color: #e0e0e0;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ЛЕВАЯ ПАНЕЛЬ */
  .sidebar {
    width: 440px;
    min-width: 440px;
    background: #25252d;
    border-right: 1px solid #383844;
    display: flex;
    flex-direction: column;
    height: 100%;
    z-index: 10;
  }
  .sidebar-header {
    padding: 16px 20px;
    background: #1a1a20;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sidebar-header h2 {
    margin: 0;
    font-size: 16px;
    color: #fff;
  }
  
  /* ПАНЕЛЬ ВКЛАДОК ПРОФИЛЕЙ */
  .tabs-container {
    display: flex;
    background: #1a1a20;
    border-bottom: 1px solid #383844;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs-container::-webkit-scrollbar { display: none; }
  .tab-btn {
    padding: 10px 16px;
    background: #1a1a20;
    color: #888;
    border: none;
    border-right: 1px solid #383844;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    transition: background 0.2s;
  }
  .tab-btn.active {
    color: #4da3ff;
    background: #25252d;
    border-bottom: 2px solid #4da3ff;
  }
  .tab-btn:hover:not(.active) {
    color: #eee;
    background: #2a2a35;
  }
  .tab-del {
    color: #ff5252;
    background: transparent;
    border: none;
    font-size: 14px;
    line-height: 1;
    padding: 0 4px;
    margin-right: -4px;
    cursor: pointer;
    display: none;
  }
  .tab-btn:hover .tab-del {
    display: inline-block;
  }
  .tab-add {
    background: transparent;
    color: #4da3ff;
    border: none;
    font-size: 18px;
    padding: 0 16px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.2s;
  }
  .tab-add:hover {
    background: #2a2a35;
  }

  .sidebar-body {
    padding: 16px 20px;
    overflow-y: auto;
    flex: 1;
  }

  .section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #4da3ff;
    margin: 16px 0 10px;
    font-weight: 700;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .form-group {
    margin-bottom: 12px;
  }
  .form-group label {
    display: block;
    font-size: 12px;
    color: #aaa;
    margin-bottom: 4px;
  }
  .form-row {
    display: flex;
    gap: 8px;
  }
  .form-row .form-group {
    flex: 1;
    margin-bottom: 0;
  }
  input, select {
    width: 100%;
    background: #18181f;
    border: 1px solid #3c3c4a;
    border-radius: 4px;
    padding: 7px 10px;
    color: #fff;
    font-size: 13px;
    outline: none;
  }
  input:focus, select:focus {
    border-color: #007acc;
  }

  .net-item {
    background: #1e1e26;
    border: 1px solid #353545;
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 8px;
  }
  .net-item-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .net-badge {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
    font-weight: bold;
    text-transform: uppercase;
  }
  .badge-gas { background: #00008b; color: #fff; }
  .badge-power { background: #ff0000; color: #fff; }
  .badge-water { background: #006400; color: #fff; }
  .badge-sewer { background: #8b4513; color: #fff; }
  .badge-heat { background: #000000; color: #fff; }
  .badge-comm { background: #ba68c8; color: #fff; }

  .btn-remove-net {
    background: none;
    border: none;
    color: #ff5252;
    cursor: pointer;
    font-size: 15px;
  }
  .btn-add-net {
    width: 100%;
    background: #2a2a38;
    color: #4da3ff;
    border: 1px dashed #4da3ff;
    padding: 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
    margin-top: 4px;
    transition: background 0.2s;
  }
  .btn-add-net:hover { background: #323245; }

  .sidebar-footer {
    padding: 14px 20px;
    background: #1a1a20;
    border-top: 1px solid #383844;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .btn-primary {
    background: #007acc;
    color: #fff;
    border: none;
    padding: 10px;
    border-radius: 5px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: background 0.2s;
  }
  .btn-primary:hover { background: #0066aa; }
  
  .btn-danger {
    background: transparent;
    color: #ff5252;
    border: 1px solid #ff5252;
    padding: 10px;
    border-radius: 5px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: all 0.2s;
  }
  .btn-danger:hover { background: rgba(255, 82, 82, 0.1); }
  
  .export-group {
    display: flex;
    gap: 8px;
  }
  .btn-secondary {
    flex: 1;
    background: #333340;
    color: #ddd;
    border: 1px solid #484858;
    padding: 7px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
  }
  .btn-secondary:hover { background: #3d3d4e; color: #fff; }

  /* ПРАВАЯ ОБЛАСТЬ: ПРОСМОТР С ЗУМОМ */
  .viewport {
    flex: 1;
    height: 100%;
    overflow: auto;
    background: #404249;
    padding: 24px;
    position: relative;
    user-select: none;
  }
  
  /* ПАНЕЛЬ МАСШТАБИРОВАНИЯ */
  .zoom-toolbar {
    position: fixed;
    top: 16px;
    right: 24px;
    background: rgba(30, 30, 36, 0.9);
    backdrop-filter: blur(4px);
    border: 1px solid #444455;
    border-radius: 6px;
    padding: 4px 8px;
    display: flex;
    align-items: center;
    gap: 6px;
    z-index: 100;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }
  .btn-zoom {
    background: #2a2a35;
    border: 1px solid #444455;
    color: #eee;
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 12px;
    cursor: pointer;
    font-weight: bold;
  }
  .btn-zoom:hover { background: #007acc; color: #fff; border-color: #007acc; }
  .zoom-val {
    font-size: 11px;
    color: #aaa;
    min-width: 44px;
    text-align: center;
  }

  /* ОБЕРТКА МАСШТАБА ЧЕРТЕЖА */
  .sheet-wrapper {
    display: inline-block;
    transform-origin: top left;
    transition: transform 0.12s ease-out;
  }
  
  .sheet {
    width: 1587px;
    height: 1122px;
    min-width: 1587px;
    min-height: 1122px;
    background: #ffffff;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    position: relative;
    padding: 38px 19px 19px 76px;
    box-sizing: border-box;
    font-family: "ISOCPEUR", "GOST 2.304 type A", "Segoe UI", Arial, sans-serif;
    color: #000;
  }
  .frame {
    width: 100%;
    height: 100%;
    border: 2px solid #000;
    position: relative;
    padding: 12px 15px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }
  .title-block {
    text-align: center;
    font-weight: bold;
    font-size: 17px;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    color: #000;
  }
  .subtitle {
    font-size: 13px;
    font-weight: normal;
    color: #333;
    margin-top: 3px;
  }
  .svg-container {
    flex: 1;
    width: 100%;
    height: calc(100% - 45px);
  }
  svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* КАСТОМНОЕ МОДАЛЬНОЕ ОКНО */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.6);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(2px);
  }
  .modal-box {
    background: #25252d;
    padding: 24px;
    border-radius: 8px;
    border: 1px solid #383844;
    width: 320px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .modal-box h3 {
    margin-top: 0;
    color: #fff;
    font-size: 15px;
    margin-bottom: 16px;
    border-bottom: 1px solid #383844;
    padding-bottom: 10px;
  }
  .modal-buttons {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  /* СТИЛИ ДЛЯ ПЕЧАТИ */
  #multiPrintArea {
    display: none;
  }
  @media print {
    body {
      background: #fff !important;
    }
    .sidebar, .zoom-toolbar, .modal-overlay {
      display: none !important;
      visibility: hidden !important;
    }
    .viewport {
      padding: 0 !important;
      margin: 0 !important;
      background: #fff !important;
      overflow: visible !important;
    }
    .sheet-wrapper {
      transform: none !important;
    }
    
    body.print-all-mode .viewport {
      display: none !important;
    }
    body.print-all-mode #multiPrintArea {
      display: block !important;
    }
    .print-page {
      page-break-after: always;
      break-after: page;
    }
    .print-page:last-child {
      page-break-after: auto;
      break-after: auto;
    }
  }
</style>
</head>
<body>

<!-- МОДАЛЬНОЕ ОКНО -->
<div class="modal-overlay" id="singleNetModal">
  <div class="modal-box">
    <h3>Добавить пересекаемую коммуникацию</h3>
    <div class="form-group">
      <label>Тип коммуникации</label>
      <select id="modalNetType">
        <option value="power">Электрокабель</option>
        <option value="gas">Газопровод</option>
        <option value="water">Водопровод</option>
        <option value="sewer">Канализация</option>
        <option value="heat">Теплосеть</option>
        <option value="comm">Кабель связи</option>
      </select>
    </div>
    <div class="form-group">
      <label>Расстояние до сети (ПК, метры)</label>
      <input type="text" id="modalNetDist" placeholder="например, 15.5">
    </div>
    <div class="modal-buttons">
      <button class="btn-primary" style="flex:1; font-size:12px; padding:8px;" onclick="confirmSingleNet()">Добавить</button>
      <button class="btn-secondary" style="flex:1; font-size:12px; padding:8px;" onclick="closeSingleNetModal()">Отмена (Закрыть)</button>
    </div>
  </div>
</div>

<div class="sidebar">
  <div class="sidebar-header">
    <h2>⚡ Профили ГНБ (А3 ГОСТ)</h2>
  </div>
  
  <!-- ПАНЕЛЬ ВКЛАДОК -->
  <div class="tabs-container" id="tabsContainer"></div>

  <div class="sidebar-body">
    <div class="section-title">Геометрия скважины</div>
    <div class="form-row">
      <div class="form-group">
        <label>Номер ГНБ</label>
        <input type="text" id="inpNumber" value="1" onchange="triggerUpdate()">
      </div>
      <div class="form-group">
        <label>Длина ГНБ L (м)</label>
        <input type="number" id="inpLength" value="60" step="1" onchange="triggerUpdate()">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Вход в котлован (гл., м)</label>
        <input type="number" id="inpEntryDepth" value="1.0" step="0.1" onchange="triggerUpdate()">
      </div>
      <div class="form-group">
        <label>Выход из скважины (гл., м)</label>
        <input type="number" id="inpExitDepth" value="1.0" step="0.1" onchange="triggerUpdate()">
      </div>
    </div>

    <div class="form-row" style="margin-top: 8px;">
      <div class="form-group">
        <label>Базовый горизонт (м)</label>
        <input type="number" id="inpHall" value="3.00" step="0.05" onchange="triggerUpdate()">
      </div>
      <div class="form-group">
        <label>Радиус Rизг (м)</label>
        <input type="number" id="inpRadius" value="50" step="5" onchange="triggerUpdate()">
      </div>
    </div>

    <div class="form-group" style="margin-top: -4px; margin-bottom: 12px;">
      <label style="display:flex; align-items:center; gap:6px; color:#4da3ff; font-size:11px; cursor:pointer;">
        <input type="checkbox" id="chkAutoSnap" checked onchange="triggerUpdate()" style="width:auto; margin:0;">
        Авто-смещение при нарушении (зазор 0.5м)
      </label>
    </div>

    <!-- АСФАЛЬТ -->
    <div class="section-title">
      <span>Зоны асфальта (проезжая часть)</span>
    </div>
    <div id="asphaltsContainer"></div>
    <button class="btn-add-net" style="margin-bottom:12px;" onclick="addAsphalt()">+ Добавить участок асфальта</button>
    
    <!-- ДЕРЕВЬЯ -->
    <div class="section-title">
      <span>Деревья (Зеленые насаждения)</span>
    </div>
    <div id="treesContainer"></div>
    <button class="btn-add-net" style="margin-bottom:12px;" onclick="addTree()">+ Добавить деревья</button>
    <div style="font-size: 10.5px; color: #777; margin-bottom: 12px;">*Все участки вне асфальта автоматически оформляются газоном. Деревья высаживаются поверх газона.</div>

    <div class="section-title">
      <span>Пересекаемые сети</span>
      <span id="netsCountBadge" style="color: #888; font-size: 11px;">0 сетей</span>
    </div>
    <div id="netsContainer"></div>
    
    <button class="btn-add-net" onclick="addNetPrompt()">+ Добавить сети (Пошаговый мастер)</button>
    <button class="btn-add-net" style="margin-top: 8px;" onclick="openSingleNetModal()">+ Добавить пересекаемую коммуникацию</button>
  </div>

  <div class="sidebar-footer">
    <button class="btn-danger" style="margin-bottom: 12px;" onclick="resetData()">
      🗑 Очистить текущий ГНБ
    </button>
    <button class="btn-primary" onclick="printPureSheet()">
      🖨️ Сохранить в PDF текущий профиль
    </button>
    <button class="btn-primary" style="margin-top: 8px;" onclick="printAllSheets()">
      🖨️ Сохранить все профили ГНБ
    </button>
    <div class="export-group" style="margin-top: 8px;">
      <button class="btn-secondary" onclick="autoOptimizeDepth()">Авто-расчет безопасной глубины</button>
    </div>
    <div class="export-group" style="margin-top: 4px;">
      <button class="btn-secondary" onclick="saveProject()">💾 Сохранить весь проект (.json)</button>
      <button class="btn-secondary" onclick="document.getElementById('fileInput').click()">📂 Загрузить проект</button>
      <input type="file" id="fileInput" accept=".json" style="display: none;" onchange="loadProject(event)">
    </div>
  </div>
</div>

<div class="viewport" id="viewportArea">
  <div class="zoom-toolbar">
    <button class="btn-zoom" onclick="zoomIn()" title="Приблизить">+</button>
    <button class="btn-zoom" onclick="zoomOut()" title="Отдалить">−</button>
    <span class="zoom-val" id="zoomValLabel">85%</span>
    <button class="btn-zoom" onclick="resetZoom(1.0)" title="Масштаб 1:1">100%</button>
    <button class="btn-zoom" onclick="fitToScreen()" title="Вписать в экран">По размеру</button>
  </div>
  
  <div class="sheet-wrapper" id="sheetWrapper"></div>
</div>

<div id="multiPrintArea"></div>

<script>
let profiles = [];
let activeProfileIdx = 0;
let state = null;

const NET_TYPES = {
  power: { label: 'Электрокабель', defaultDepth: 0.7, color: '#ff0000', badge: 'badge-power' },
  comm:  { label: 'Кабель связи', defaultDepth: 0.7, color: '#ba68c8', badge: 'badge-comm' },
  gas:   { label: 'Газопровод', defaultDepth: 2.0, color: '#00008b', badge: 'badge-gas' },
  water: { label: 'Водопровод', defaultDepth: 2.0, color: '#006400', badge: 'badge-water' },
  sewer: { label: 'Канализация', defaultDepth: 2.0, color: '#8b4513', badge: 'badge-sewer' },
  heat:  { label: 'Теплосеть', defaultDepth: 2.0, color: '#000000', badge: 'badge-heat' }
};

function getDefaultProfile(numStr) {
  return {
    hddNumber: numStr,
    length: 60,
    depthHall: 3.00,
    entryDepth: 1.0,
    exitDepth: 1.0,
    radius: 50,
    asphalts: [],
    trees: [],
    nets: []
  };
}

/* ЛОГИКА ВКЛАДОК */
function renderTabs() {
  const container = document.getElementById('tabsContainer');
  container.innerHTML = '';
  
  profiles.forEach((p, idx) => {
      const btn = document.createElement('div');
      btn.className = `tab-btn ${idx === activeProfileIdx ? 'active' : ''}`;
      btn.onclick = () => switchTab(idx);
      btn.innerHTML = `ГНБ №${p.hddNumber}`;
      
      if (profiles.length > 1) {
          const delBtn = document.createElement('span');
          delBtn.className = 'tab-del';
          delBtn.innerHTML = '×';
          delBtn.title = "Удалить профиль";
          delBtn.onclick = (e) => {
              e.stopPropagation();
              deleteTab(idx);
          };
          btn.appendChild(delBtn);
      }
      container.appendChild(btn);
  });
  
  const addBtn = document.createElement('button');
  addBtn.className = 'tab-add';
  addBtn.innerHTML = '+';
  addBtn.title = 'Добавить новый прокол';
  addBtn.onclick = addNewTab;
  container.appendChild(addBtn);
}

function switchTab(idx) {
  activeProfileIdx = idx;
  state = profiles[activeProfileIdx];
  renderTabs(); // <-- ОБНОВЛЯЕТ ИНТЕРФЕЙС ВКЛАДОК
  syncInputs();
  renderAsphaltsList();
  renderTreesList();
  renderNetsList();
  triggerUpdate();
}

function addNewTab() {
  let nextNum = 1;
  profiles.forEach(p => {
      let num = parseInt(p.hddNumber);
      if (!isNaN(num) && num >= nextNum) {
          nextNum = num + 1;
      }
  });
  profiles.push(getDefaultProfile(nextNum.toString()));
  switchTab(profiles.length - 1);
}

function deleteTab(idx) {
  if (profiles.length <= 1) return;
  if (confirm(`Вы действительно хотите удалить вкладку ГНБ №${profiles[idx].hddNumber}?`)) {
      profiles.splice(idx, 1);
      if (activeProfileIdx >= profiles.length) {
          activeProfileIdx = profiles.length - 1;
      } else if (activeProfileIdx > idx) {
          activeProfileIdx--; 
      }
      switchTab(activeProfileIdx);
  }
}

// СБРОС ТЕКУЩЕЙ ВКЛАДКИ
function resetData(confirmPrompt = true) {
  if (confirmPrompt && !confirm(`Вы уверены, что хотите очистить ГНБ №${state.hddNumber}? Все трубы и сети на этой вкладке будут удалены.`)) {
    return;
  }
  let currentNum = state.hddNumber;
  profiles[activeProfileIdx] = getDefaultProfile(currentNum);
  state = profiles[activeProfileIdx];
  
  syncInputs();
  renderAsphaltsList();
  renderTreesList();
  renderNetsList();
  triggerUpdate();
}

// СОХРАНЕНИЕ ПРОЕКТА В JSON
function saveProject() {
    const dataToSave = {
        version: "2.0",
        profiles: profiles,
        activeIndex: activeProfileIdx
    };
    const dataStr = JSON.stringify(dataToSave, null, 2);
    const blob = new Blob([dataStr], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Проект_ГНБ_(${profiles.length}_шт).json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

// ЗАГРУЗКА ПРОЕКТА ИЗ JSON
function loadProject(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const loadedState = JSON.parse(e.target.result);
            if (loadedState.profiles) {
                profiles = loadedState.profiles;
                activeProfileIdx = loadedState.activeIndex || 0;
            } else if (loadedState.length !== undefined) {
                profiles = [loadedState];
                activeProfileIdx = 0;
            } else {
                alert("Ошибка: Неверный формат файла.");
                return;
            }
            
            profiles.forEach(p => {
                if (!p.hddNumber) p.hddNumber = "1";
                if (!p.asphalts) p.asphalts = [];
                if (!p.trees) p.trees = []; 
                if (!p.nets) p.nets = [];
            });
            
            if (activeProfileIdx >= profiles.length) activeProfileIdx = 0;
            switchTab(activeProfileIdx);
        } catch (err) {
            alert("Ошибка при чтении файла проекта!");
        }
        event.target.value = ''; 
    };
    reader.readAsText(file);
}

function getTruePipeDepth(x, dHall, dEnt, dEx, L, R) {
    if (x <= 2.0) return dEnt;
    if (x >= L - 2.0) return dEx;

    let h1 = Math.max(0, dHall - dEnt);
    let L1 = Math.sqrt(Math.max(0, 2 * R * h1 - h1 * h1));
    let h2 = Math.max(0, dHall - dEx);
    let L2 = Math.sqrt(Math.max(0, 2 * R * h2 - h2 * h2));

    let xHorizStart = 2.0 + L1;
    let xHorizEnd = L - 2.0 - L2;

    if (xHorizStart > xHorizEnd) return dHall; 

    if (x < xHorizStart) {
        let dx = xHorizStart - x;
        return dHall - R + Math.sqrt(Math.max(0, R * R - dx * dx));
    } else if (x > xHorizEnd) {
        let dx = x - xHorizEnd;
        return dHall - R + Math.sqrt(Math.max(0, R * R - dx * dx));
    } else {
        return dHall;
    }
}

function snapToSafeDepth(targetD) {
    if (state.nets.length === 0) return targetD;

    const L = state.length;
    const R = state.radius;
    const clearance = 0.58; 

    function isValid(d) {
        if (d < Math.max(state.entryDepth, state.exitDepth)) return false;
        let h1 = d - state.entryDepth;
        let L1 = Math.sqrt(Math.max(0, 2*R*h1 - h1*h1));
        let h2 = d - state.exitDepth;
        let L2 = Math.sqrt(Math.max(0, 2*R*h2 - h2*h2));
        if (2.0 + L1 >= L - 2.0 - L2) return false;

        for (let net of state.nets) {
            let pipeY = getTruePipeDepth(net.dist, d, state.entryDepth, state.exitDepth, L, R);
            if (Math.abs(pipeY - net.depth) < clearance) return false;
        }
        return true;
    }

    if (isValid(targetD)) return targetD;

    for (let step = 0.05; step <= 25.0; step += 0.05) {
        let up = targetD - step;
        let down = targetD + step;

        if (up >= Math.max(state.entryDepth, state.exitDepth) && isValid(up)) return up;
        if (isValid(down)) return down;
    }
    return null;
}

let currentZoom = 0.85;

function applyZoom() {
  const wrapper = document.getElementById('sheetWrapper');
  wrapper.style.transform = `scale(${currentZoom})`;
  document.getElementById('zoomValLabel').textContent = Math.round(currentZoom * 100) + '%';
}

function zoomIn() {
  currentZoom = Math.min(2.5, currentZoom + 0.1);
  applyZoom();
}

function zoomOut() {
  currentZoom = Math.max(0.3, currentZoom - 0.1);
  applyZoom();
}

function resetZoom(val = 1.0) {
  currentZoom = val;
  applyZoom();
}

function fitToScreen() {
  const vp = document.getElementById('viewportArea');
  const availableW = vp.clientWidth - 48;
  const availableH = vp.clientHeight - 48;
  const sheetW = 1587;
  const sheetH = 1122;

  const ratioW = availableW / sheetW;
  const ratioH = availableH / sheetH;
  currentZoom = +(Math.min(ratioW, ratioH)).toFixed(2);
  currentZoom = Math.max(0.3, Math.min(1.5, currentZoom));
  applyZoom();
}

document.getElementById('viewportArea').addEventListener('wheel', function(e) {
  if (e.ctrlKey || e.metaKey) {
    e.preventDefault();
    if (e.deltaY < 0) zoomIn();
    else zoomOut();
  }
}, { passive: false });

function syncInputs() {
  document.getElementById('inpNumber').value = state.hddNumber;
  document.getElementById('inpLength').value = state.length;
  document.getElementById('inpHall').value = state.depthHall;
  document.getElementById('inpEntryDepth').value = state.entryDepth;
  document.getElementById('inpExitDepth').value = state.exitDepth;
  document.getElementById('inpRadius').value = state.radius;
}

function triggerUpdate() {
  let oldNumber = state.hddNumber;
  state.hddNumber = document.getElementById('inpNumber').value || "1";
  state.length = parseFloat(document.getElementById('inpLength').value) || 60;
  let userDepth = parseFloat(document.getElementById('inpHall').value) || 3.5;
  state.entryDepth = parseFloat(document.getElementById('inpEntryDepth').value) || 1.0;
  state.exitDepth = parseFloat(document.getElementById('inpExitDepth').value) || 1.0;
  state.radius = parseFloat(document.getElementById('inpRadius').value) || 50;

  if (document.getElementById('chkAutoSnap').checked && state.nets.length > 0) {
      let safeDepth = snapToSafeDepth(userDepth);
      if (safeDepth !== null && Math.abs(safeDepth - userDepth) > 0.01) {
          state.depthHall = +(safeDepth.toFixed(2));
          document.getElementById('inpHall').value = state.depthHall;
      } else {
          state.depthHall = userDepth;
      }
  } else {
      state.depthHall = userDepth;
  }

  if (oldNumber !== state.hddNumber) {
      renderTabs(); 
  }

  localStorage.setItem('gnbProfilesArray', JSON.stringify(profiles));
  localStorage.setItem('gnbActiveIndex', activeProfileIdx);

  renderSvg();
}

function addNetPrompt() {
  const wizardSteps = [
    { id: 'power', defaultName: 'Электрокабель', defaultDepth: 0.7 },
    { id: 'gas', defaultName: 'Газопровод', defaultDepth: 2.0 },
    { id: 'water', defaultName: 'Водопровод', defaultDepth: 2.0 },
    { id: 'sewer', defaultName: 'Канализация', defaultDepth: 2.0 },
    { id: 'heat', defaultName: 'Теплотрасса', defaultDepth: 2.0 },
    { id: 'comm', defaultName: 'Кабель связи', defaultDepth: 0.7 }
  ];

  let addedAny = false;

  for (let i = 0; i < wizardSteps.length; i++) {
    let step = wizardSteps[i];
    let countInput = prompt(`ШАГ ${i+1} из 6: ${step.defaultName}\n\nСколько пересечений типа "${step.defaultName}" на трассе?\n(Оставьте 0 и нажмите ОК, чтобы пропустить эту сеть)`, "0");
    
    if (countInput === null) {
        break; 
    }
    
    let count = parseInt(countInput) || 0;
    
    for (let j = 0; j < count; j++) {
       let distInput = prompt(`📍 Укажите пикет (ПК) для сети "${step.defaultName}" (${j + 1} из ${count}):\n\nВведите расстояние в метрах от начала (например, 15.5)`, "");
       
       if (distInput !== null && distInput.trim() !== "") {
           let dist = parseFloat(distInput.replace(',', '.')) || 0;
           state.nets.push({
               type: step.id,
               name: step.defaultName + (count > 1 ? ` ${j + 1}` : ''),
               dist: dist,
               depth: step.defaultDepth
           });
           addedAny = true;
       }
    }
  }

  if (addedAny) {
    renderNetsList();
    triggerUpdate();
  }
}

function autoOptimizeDepth() {
  if (state.nets.length === 0) {
      alert("Нет сетей для обхода!");
      return;
  }
  let maxNetDepth = 0.5;
  state.nets.forEach(n => { if (n.depth > maxNetDepth) maxNetDepth = n.depth; });
  
  let targetD = maxNetDepth + 0.58 + 0.15; 
  
  let safeD = snapToSafeDepth(targetD);
  if (safeD) {
      state.depthHall = +(safeD.toFixed(2));
      document.getElementById('inpHall').value = state.depthHall;
      triggerUpdate();
      alert(`Горизонт перенесен ПОД все сети на отметку: -${state.depthHall} м.`);
  } else {
      alert("Не удалось найти безопасную глубину ниже всех сетей. Попробуйте уменьшить радиус.");
  }
}

// ГЕНЕРАЦИЯ HTML-БЛОКА ДЛЯ ОДНОГО ПРОФИЛЯ
function getProfileHtml(s, isMultiPrint) {
  const L = s.length;
  const R = s.radius;
  
  const leftX = 80;
  const rightX = 1380;
  const scaleX = (rightX - leftX) / L;
  const toSvgX = (dist) => leftX + (dist * scaleX);
  
  const groundY = 300;
  const scaleY = 60;
  const toSvgY = (absElev) => groundY + absElev * scaleY;

  let markup = '';

  // СЕТКА ВЫСОТ И ПИКЕТАЖА
  let gridLines = '';
  let gridTextsX = '';
  
  let xPts = [];
  for (let x = 0; x <= L; x += 5) xPts.push(x);
  if (L % 5 !== 0) xPts.push(L);
  
  xPts.forEach(x => {
      let px = toSvgX(x);
      gridLines += `<line x1="${px}" y1="${groundY-120}" x2="${px}" y2="${groundY+480}" stroke-dasharray="3,3" />`;
      gridTextsX += `<text x="${px}" y="${groundY+496}">${x}</text>`;
  });

  markup += `
    <g stroke="rgb(128, 128, 128)" stroke-width="1.2">
      ${gridLines}
  `;
  for (let d = -2; d <= 8; d++) {
      let gy = groundY + d * scaleY;
      if (d === 0) {
          markup += `<line x1="${leftX-20}" y1="${gy}" x2="${rightX+20}" y2="${gy}" stroke="#000" stroke-width="1.5" />`;
      } else {
          markup += `<line x1="${leftX-20}" y1="${gy}" x2="${rightX+20}" y2="${gy}" stroke-dasharray="3,3" />`;
      }
  }
  markup += `</g>`;

  // Подписи глубин
  markup += `
    <g font-size="10.5" fill="#666" text-anchor="middle">
      ${gridTextsX}
    </g>
    <g font-size="11" fill="#444" text-anchor="end">
  `;
  for (let d = -2; d <= 8; d++) {
      let gy = groundY + d * scaleY;
      let valStr = (-d > 0 ? "+" : "") + (-d).toFixed(2);
      if (d === 0) valStr = "0.000 (Земля)";
      let fw = (d === 0) ? 'font-weight="bold" fill="#000"' : '';
      markup += `<text x="${leftX-28}" y="${gy+4}" ${fw}>${valStr}</text>`;
  }
  markup += `
    </g>
    <text x="${leftX-28}" y="${groundY+496}" font-size="10.5" fill="#444" font-weight="bold" text-anchor="end">ПК (м):</text>
  `;

  // ЗОНЫ АСФАЛЬТА И ГАЗОНА
  let rawAsphalts = s.asphalts.map(a => ({ start: Math.max(0, Math.min(L, a.start)), end: Math.max(0, Math.min(L, a.end)) }))
                              .filter(a => a.start < a.end)
                              .sort((a,b) => a.start - b.start);
  
  let asphalts = [];
  if (rawAsphalts.length > 0) {
      let current = rawAsphalts[0];
      for (let i = 1; i < rawAsphalts.length; i++) {
          if (rawAsphalts[i].start <= current.end) {
              current.end = Math.max(current.end, rawAsphalts[i].end);
          } else {
              asphalts.push(current);
              current = rawAsphalts[i];
          }
      }
      asphalts.push(current);
  }

  let grasses = [];
  let currentPos = 0;
  asphalts.forEach(a => {
      if (a.start > currentPos) grasses.push({ start: currentPos, end: a.start });
      currentPos = a.end;
  });
  if (currentPos < L) grasses.push({ start: currentPos, end: L });

  grasses.forEach(g => {
    const w = toSvgX(g.end) - toSvgX(g.start);
    markup += `
      <rect x="${toSvgX(g.start)}" y="${groundY-8}" width="${w}" height="8" fill="#d4edda" stroke="#28a745" stroke-width="1" />
      <text x="${toSvgX((g.start+g.end)/2)}" y="${groundY-15}" text-anchor="middle" font-size="10.5" font-weight="bold" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Газон</text>
      <text x="${toSvgX((g.start+g.end)/2)}" y="${groundY-15}" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#28a745">Газон</text>
    `;
  });

  asphalts.forEach(a => {
    const w = toSvgX(a.end) - toSvgX(a.start);
    markup += `
      <rect x="${toSvgX(a.start)-2}" y="${groundY-16}" width="4" height="16" fill="#333" />
      <rect x="${toSvgX(a.start)}" y="${groundY-10}" width="${w}" height="10" fill="url(#asphaltHatch)" stroke="#111" stroke-width="1.8" />
      <rect x="${toSvgX(a.end)-2}" y="${groundY-16}" width="4" height="16" fill="#333" />
      <text x="${toSvgX((a.start+a.end)/2)}" y="${groundY-18}" text-anchor="middle" font-size="11" font-weight="bold" fill="#111">Асфальтобетон</text>
    `;
  });

  // ОТРИСОВКА ДЕРЕВЬЕВ
  let rawTrees = s.trees.map(t => ({ start: Math.max(0, Math.min(L, t.start)), end: Math.max(0, Math.min(L, t.end)) }))
                        .filter(t => t.start < t.end)
                        .sort((a,b) => a.start - b.start);

  rawTrees.forEach(t => {
      let treeMarkup = '';
      for(let px = t.start; px <= t.end; px += 4) {
          let tx = toSvgX(px);
          let ty = groundY - 8;
          treeMarkup += `
            <line x1="${tx}" y1="${ty}" x2="${tx}" y2="${ty-14}" stroke="#795548" stroke-width="2.5" />
            <circle cx="${tx}" cy="${ty-18}" r="6.5" fill="#81c784" stroke="#2e7d32" stroke-width="1" />
            <circle cx="${tx-5}" cy="${ty-13}" r="5" fill="#81c784" stroke="#2e7d32" stroke-width="1" />
            <circle cx="${tx+5}" cy="${ty-13}" r="5" fill="#81c784" stroke="#2e7d32" stroke-width="1" />
          `;
      }
      markup += `
        ${treeMarkup}
        <text x="${toSvgX((t.start+t.end)/2)}" y="${groundY-32}" text-anchor="middle" font-size="10.5" font-weight="bold" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Зеленые насаждения</text>
        <text x="${toSvgX((t.start+t.end)/2)}" y="${groundY-32}" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1b5e20">Зеленые насаждения</text>
      `;
  });

  // КОТЛОВАНЫ
  const pitWidthPx = 2.0 * scaleX;
  const pitDepthPx = 2.0 * scaleY;
  markup += `
    <rect x="${toSvgX(0)}" y="${groundY}" width="${pitWidthPx}" height="${pitDepthPx}" fill="url(#pitHatch)" stroke="#9c27b0" stroke-width="1.5" />
    <line x1="${toSvgX(0)}" y1="${groundY}" x2="${toSvgX(0)}" y2="${groundY+pitDepthPx}" stroke="#9c27b0" stroke-width="2.5" />
    
    <rect x="${toSvgX(L-2.0)}" y="${groundY}" width="${pitWidthPx}" height="${pitDepthPx}" fill="url(#pitHatch)" stroke="#9c27b0" stroke-width="1.5" />
    <line x1="${toSvgX(L)}" y1="${groundY}" x2="${toSvgX(L)}" y2="${groundY+pitDepthPx}" stroke="#9c27b0" stroke-width="2.5" />
  `;

  // ТРАЕКТОРИЯ 
  let pathD = `M ${toSvgX(2.0)} ${toSvgY(s.entryDepth)}`;
  for (let x = 2.0; x <= L - 2.0; x += 0.5) {
      let y = getTruePipeDepth(x, s.depthHall, s.entryDepth, s.exitDepth, L, R);
      pathD += ` L ${toSvgX(x)} ${toSvgY(y)}`;
  }
  let yEx = getTruePipeDepth(L - 2.0, s.depthHall, s.entryDepth, s.exitDepth, L, R);
  pathD += ` L ${toSvgX(L - 2.0)} ${toSvgY(yEx)}`;

  markup += `
    <path d="${pathD}" fill="none" stroke="#9c27b0" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="${pathD}" fill="none" stroke="#6a1b9a" stroke-width="1.8" stroke-dasharray="8,4" stroke-linejoin="round" />
  `;

  // ВЫНОСКИ ТРАЕКТОРИИ
  let h1 = Math.max(0, s.depthHall - s.entryDepth);
  let L1 = Math.sqrt(Math.max(0, 2 * R * h1 - h1 * h1));
  let h2 = Math.max(0, s.depthHall - s.exitDepth);
  let L2 = Math.sqrt(Math.max(0, 2 * R * h2 - h2 * h2));
  let xHorizStart = 2.0 + L1;
  let xHorizEnd = L - 2.0 - L2;
  let horizLen = Math.max(0, xHorizEnd - xHorizStart);

  let xPitStart = toSvgX(2.0);
  let yPitStart = toSvgY(s.entryDepth);
  let xPitEnd = toSvgX(L - 2.0);
  let yPitEnd = toSvgY(s.exitDepth);
  let yHoriz = toSvgY(s.depthHall);

  markup += `
    <circle cx="${xPitStart}" cy="${yPitStart}" r="4.5" fill="#9c27b0" />
    <circle cx="${xPitEnd}" cy="${yPitEnd}" r="4.5" fill="#9c27b0" />
    
    <text x="${xPitStart}" y="${yPitStart - 10}" font-size="10.5" fill="#6a1b9a" font-weight="bold" text-anchor="middle">Вход -${s.entryDepth.toFixed(2)}м</text>
    <text x="${xPitEnd}" y="${yPitEnd - 10}" font-size="10.5" fill="#6a1b9a" font-weight="bold" text-anchor="middle">Выход -${s.exitDepth.toFixed(2)}м</text>
    
    <text x="${toSvgX(2.0 + L1 + horizLen/2)}" y="${yHoriz+20}" font-size="11.5" fill="#6a1b9a" font-weight="bold" text-anchor="middle">Горизонт (отм. оси -${s.depthHall.toFixed(3)}м, гл. ${s.depthHall.toFixed(2)}м)</text>
  `;

  // ВЫНОСКИ СЕТЕЙ
  let linesMarkup = '';
  let textsMarkup = '';
  let drawNets = [...s.nets].sort((a, b) => a.dist - b.dist);

  drawNets.forEach((net) => {
    const nx = toSvgX(net.dist);
    const ny = toSvgY(net.depth);
    const conf = NET_TYPES[net.type] || NET_TYPES.gas;
    
    let pipeYAtDist = getTruePipeDepth(net.dist, s.depthHall, s.entryDepth, s.exitDepth, L, R);
    const centerDist = Math.abs(pipeYAtDist - net.depth);
    const deltaHVal = centerDist - 0.080; 
    const deltaHStr = deltaHVal.toFixed(2).replace('.', ',');
    
    const isUnderNorm = deltaHVal < 0.49; 
    const textEndY = 830; 
    
    const paramStr = `${net.name}, Δh=${deltaHStr}м${isUnderNorm ? ' (! < 0,5м)' : ''}`;
    const textFill = isUnderNorm ? '#d32f2f' : conf.color;
    const textWeight = isUnderNorm ? 'bold' : 'normal';

    linesMarkup += `
      <circle cx="${nx}" cy="${ny}" r="6.5" fill="${conf.color}" stroke="${isUnderNorm ? '#d32f2f' : conf.color}" stroke-width="${isUnderNorm ? '2' : '1.2'}" />
      <line x1="${nx}" y1="${groundY}" x2="${nx}" y2="${ny - 6.5}" stroke="${conf.color}" stroke-width="1.2" stroke-dasharray="2,2" />
      <line x1="${nx}" y1="${ny + 6.5}" x2="${nx}" y2="${textEndY}" stroke="${conf.color}" stroke-width="1.2" />
    `;

    textsMarkup += `
      <text x="${nx + 4}" y="${textEndY}" font-size="10.5" font-weight="${textWeight}" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" text-anchor="end" transform="rotate(-90 ${nx + 4} ${textEndY})">${paramStr}</text>
      <text x="${nx + 4}" y="${textEndY}" font-size="10.5" fill="${textFill}" font-weight="${textWeight}" text-anchor="end" transform="rotate(-90 ${nx + 4} ${textEndY})">${paramStr}</text>
    `;
  });

  markup += linesMarkup + textsMarkup; 

  // ПРИМЕЧАНИЯ
  markup += `
    <g font-size="10" fill="#333">
      <text x="${leftX-20}" y="1350" font-weight="bold">Примечания:</text>
      <text x="${leftX-20}" y="1366">1. Закрытый переход КЛ выполнить методом ГНБ установкой с тяговым усилием не менее 150 кН.</text>
      <text x="${leftX-20}" y="1380">2. Перед началом буровых работ выполнить контрольное шурфование всех пересекаемых коммуникаций в присутствии представителей эксплуатирующих служб.</text>
    </g>
  `;

  return `
    <div class="sheet ${isMultiPrint ? 'print-page' : ''}">
      <div class="frame">
        <div class="title-block">
          ПРОДОЛЬНЫЙ ПРОФИЛЬ ЗАКРЫТОГО ПЕРЕХОДА МЕТОДОМ ГНБ №${s.hddNumber}
          <div class="subtitle">
            Масштаб: горизонтальный 1:${L > 70 ? 200 : 100}, вертикальный 1:50 | Длина перехода L = ${L.toFixed(1)} м
          </div>
        </div>
        <div class="svg-container">
          <svg viewBox="0 0 1460 1400">
            <defs>
              <pattern id="pitHatch_${s.hddNumber}" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
                <line x1="0" y1="0" x2="0" y2="8" stroke="#9c27b0" stroke-width="1.2" />
              </pattern>
              <pattern id="asphaltHatch_${s.hddNumber}" width="6" height="6" patternTransform="rotate(-45 0 0)" patternUnits="userSpaceOnUse">
                <line x1="0" y1="0" x2="0" y2="6" stroke="#444" stroke-width="0.8" />
              </pattern>
            </defs>
            ${markup.replace(/url\(#pitHatch\)/g, `url(#pitHatch_${s.hddNumber})`).replace(/url\(#asphaltHatch\)/g, `url(#asphaltHatch_${s.hddNumber})`)}
          </svg>
        </div>
      </div>
    </div>
  `;
}

function renderSvg() {
  document.getElementById('sheetWrapper').innerHTML = getProfileHtml(state, false);
}

function printPureSheet() {
  const savedZoom = currentZoom;
  document.getElementById('sheetWrapper').style.transform = 'none';

  setTimeout(() => {
    window.print();
    setTimeout(() => {
      document.getElementById('sheetWrapper').style.transform = `scale(${savedZoom})`;
    }, 300);
  }, 50);
}

// ПЕЧАТЬ ВСЕХ ВКЛАДОК ОДНИМ ФАЙЛОМ
function printAllSheets() {
  const multiArea = document.getElementById('multiPrintArea');
  multiArea.innerHTML = profiles.map(p => getProfileHtml(p, true)).join('');
  
  document.body.classList.add('print-all-mode');
  
  setTimeout(() => {
    window.print();
    setTimeout(() => {
      document.body.classList.remove('print-all-mode');
      multiArea.innerHTML = '';
    }, 300);
  }, 50);
}

// ЗАГРУЗКА ИЗ LOCALSTORAGE ПРИ ОТКРЫТИИ
window.onload = () => {
  const savedArr = localStorage.getItem('gnbProfilesArray');
  const savedIdx = localStorage.getItem('gnbActiveIndex');
  
  if (savedArr) {
    try {
      profiles = JSON.parse(savedArr);
      activeProfileIdx = parseInt(savedIdx) || 0;
      
      if (activeProfileIdx >= profiles.length) activeProfileIdx = 0;
      
      // Защита старых сейвов
      profiles.forEach(p => {
          if (!p.hddNumber) p.hddNumber = "1";
          if (!p.asphalts) p.asphalts = [];
          if (!p.trees) p.trees = [];
          if (!p.nets) p.nets = [];
      });
      
      switchTab(activeProfileIdx);
    } catch(e) {
      console.error("Ошибка загрузки памяти браузера", e);
      profiles = [getDefaultProfile("1")];
      switchTab(0);
    }
  } else {
    profiles = [getDefaultProfile("1")];
    switchTab(0);
  }
  
  renderTabs();
  fitToScreen();
};
</script>
